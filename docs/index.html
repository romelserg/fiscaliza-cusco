<style>
/* Layout: registro en papel crema — cabecera de afiche, franja de tocapu, "tejido" de votos como pieza central,
   padrón de representantes en filas de libro de actas, fichas individuales por ancla. */
:root {
  --paper: #f4ede0;      /* fondo */
  --paper-2: #ebe2d0;    /* bandas y filas alternas */
  --ink: #2b2520;        /* tinta principal */
  --ink-2: #6b6157;      /* tinta secundaria */
  --rule: #d6c9b2;       /* filetes */
  --si: #1f6fa3;         /* a favor (validado CVD) */
  --no: #b23a48;         /* en contra: cochinilla */
  --abst: #a8761a;       /* abstención: ocre */
  --vacio: #cfc3ad;      /* no votó / ausente */
  --r1: #3b2f26; --r2: #8a7563; --r3: #cdbfa9;  /* rampa de relación con Cusco */
  --marca-borde: transparent;
  /* en modo oscuro el ícono necesita un borde para separarse del fondo */
  --b-FP: #bd6a24; --b-PCO: #665f00; --b-AN: #05987a; --b-RP: #1d58a3; --b-PBG: #8a6fc0; --b-JP: #a03d62;  /* bancadas: forma + color */
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --acta: "Courier Prime", "Courier New", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1f1b17; --paper-2: #29241e; --ink: #efe6d6; --ink-2: #b3a796; --rule: #3d362e;
    --si: #3f93cf; --no: #de6474; --abst: #b98a1f; --vacio: #4a4238;
    --r1: #efe6d6; --r2: #a8957f; --r3: #5a4f43; --marca-borde: #5a4f43;
    --b-FP: #c87e41; --b-PCO: #6c7a15; --b-AN: #0baa92; --b-RP: #087aaf; --b-PBG: #9b81d2; --b-JP: #a85071;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1f1b17; --paper-2: #29241e; --ink: #efe6d6; --ink-2: #b3a796; --rule: #3d362e;
  --si: #3f93cf; --no: #de6474; --abst: #b98a1f; --vacio: #4a4238;
  --r1: #efe6d6; --r2: #a8957f; --r3: #5a4f43; --marca-borde: #5a4f43;
  --b-FP: #c87e41; --b-PCO: #6c7a15; --b-AN: #0baa92; --b-RP: #087aaf; --b-PBG: #9b81d2; --b-JP: #a85071;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15.5px/1.6 var(--body); }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 72px; display: grid; gap: 56px; }
a { color: inherit; text-decoration-color: var(--rule); text-decoration-thickness: 2px; text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--no); }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.acta { font-family: var(--acta); }
.muted { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }
.small { font-size: 0.88rem; }

/* franja de tocapu */
.tocapu { display: block; width: 100%; height: 18px; }

/* cabecera */
.masthead { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px 48px; align-items: end; }
.masthead h1 { font: 800 clamp(3.2rem, 10vw, 7.2rem)/0.86 var(--display); text-transform: uppercase; letter-spacing: -0.01em; }
.masthead h1 span { display: flex; align-items: flex-end; gap: 0.12em; color: var(--no); }
.marca { width: 0.74em; height: 0.74em; flex: none; margin-bottom: 0.06em; border-radius: 0.14em; box-shadow: 0 0 0 1px var(--marca-borde); }
.masthead .lead { font-size: 1.05rem; max-width: 46ch; }
.masthead .meta { display: grid; gap: 2px; margin-top: 14px; font: 0.84rem/1.5 var(--acta); color: var(--ink-2); }
@media (max-width: 720px) { .masthead { grid-template-columns: 1fr; } }

/* encabezados de sección */
.sec { display: grid; gap: 18px; min-width: 0; }
.sec-head { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: 4px 24px; border-top: 2px solid var(--ink); padding-top: 12px; }
.sec-head .folio { font: 700 0.8rem/1.4 var(--acta); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
.sec-head h2 { font: 800 clamp(1.7rem, 4vw, 2.5rem)/1 var(--display); text-transform: uppercase; }
.sec-head p { grid-column: 2; max-width: 64ch; color: var(--ink-2); }
@media (max-width: 720px) { .sec-head { grid-template-columns: 1fr; } .sec-head p { grid-column: 1; } }

/* leyendas */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.84rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 2px; background: var(--c); display: inline-block; }

/* tejido */
.tejido { overflow-x: auto; padding-bottom: 4px; }
.tejido svg { display: block; max-width: none; height: auto; }
.tejido text { fill: var(--ink-2); font-family: var(--acta); font-size: 11px; }
.tejido text.nombre { fill: var(--ink); font-family: var(--body); font-size: 13px; font-weight: 600; }
.cell { stroke: var(--paper); stroke-width: 0; cursor: default; }
.cell:hover { stroke: var(--ink); stroke-width: 2px; }
.f-SI { fill: var(--si); } .f-NO { fill: var(--no); } .f-ABST { fill: var(--abst); }
.f-otro { fill: var(--vacio); } .f-pres { fill: transparent; stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 2 2; }

/* padrón */
.padron { display: grid; }
.fila { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr) minmax(0, 9rem); gap: 10px 28px; align-items: center;
  padding: 18px 4px; border-bottom: 1px solid var(--rule); text-decoration: none; color: inherit; }
.fila:hover { background: var(--paper-2); }
.fila .nombre { font: 800 1.7rem/1 var(--display); text-transform: uppercase; }
.fila .sub { font-size: 0.82rem; color: var(--ink-2); margin-top: 4px; }
.fila .graf { display: grid; gap: 8px; min-width: 0; }
.fila .props { font: 0.84rem/1.4 var(--acta); color: var(--ink-2); text-align: right; }
.fila .props b { display: block; font: 800 2rem/1 var(--display); color: var(--ink); }
.etq { font: 0.76rem/1.2 var(--acta); color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.04em; }
@media (max-width: 760px) { .fila { grid-template-columns: 1fr; } .fila .props { text-align: left; } }

/* barras */
.stack { display: flex; gap: 2px; height: 14px; }
.stack i { display: block; height: 100%; }
.stack i:first-child { border-radius: 3px 0 0 3px; } .stack i:last-child { border-radius: 0 3px 3px 0; }
.stack-lab { display: flex; flex-wrap: wrap; gap: 2px 14px; font: 0.8rem/1.3 var(--acta); color: var(--ink-2); }
.stack-lab b { color: var(--ink); font-weight: 700; }
.pases { display: flex; flex-wrap: wrap; gap: 2px; }
.pases i { width: 8px; height: 14px; background: var(--ink); border-radius: 1px; }
.pases i.no { background: transparent; box-shadow: inset 0 0 0 1.5px var(--no); }

/* gráfico de barras horizontales (proyectos) */
.hbars { display: grid; gap: 10px; max-width: 760px; }
.hbar { display: grid; grid-template-columns: 9rem minmax(0, 1fr) 2.5rem; gap: 12px; align-items: center; }
.hbar .track { display: flex; gap: 2px; height: 20px; }
.hbar .track i { height: 100%; display: block; }
.hbar .track i:last-of-type { border-radius: 0 4px 4px 0; }
.hbar .v { font: 700 0.95rem var(--acta); }
.hbar .n { font-weight: 600; font-size: 0.92rem; }

/* listas tipo acta */
.lista { display: grid; }
.item { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 4px 20px; padding: 16px 0; border-bottom: 1px solid var(--rule); }
.item .exp { font: 0.82rem/1.5 var(--acta); color: var(--ink-2); }
.item .exp a { color: var(--ink); }
.item h3 { font: 600 1.05rem/1.35 var(--body); }
.item .txt { max-width: 68ch; display: grid; gap: 6px; }
.item .nota { font-size: 0.88rem; color: var(--ink-2); }
.pill { display: inline-block; font: 0.74rem/1 var(--acta); padding: 4px 7px; border: 1px solid currentColor; border-radius: 2px; margin-top: 6px; }
@media (max-width: 640px) { .item { grid-template-columns: 1fr; } }

/* intervenciones */
.cita { margin: 4px 0 0; padding: 0; font: 600 1.15rem/1.4 var(--body); max-width: 60ch; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 8px; }
.cita::before { content: "“"; font: 800 2.6rem/0.8 var(--display); color: var(--no); }
.ese-dia { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font: 0.78rem/1.3 var(--acta); color: var(--ink-2); margin-top: 4px; }
.ese-dia .voto { cursor: default; }
.chip-voto { display: inline-flex; align-items: center; gap: 5px; padding: 3px 6px; border: 1px solid var(--rule); border-radius: 2px; }
.chip-voto::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--c, var(--vacio)); }

/* contexto: gráfico de puntos */
.comp { display: grid; gap: 18px; max-width: 760px; }
.comp-fila { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 4px 20px; align-items: center; }
.comp-fila .t { font-weight: 600; font-size: 0.92rem; }
.comp-fila .d { grid-column: 2; font: 0.8rem/1.4 var(--acta); color: var(--ink-2); }
.comp svg { width: 100%; height: 30px; display: block; overflow: visible; }
.comp svg text { font: 10px var(--acta); fill: var(--ink-2); }
.leyenda-comp { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.84rem; color: var(--ink-2); }
.leyenda-comp svg { width: 12px; height: 12px; vertical-align: -1px; margin-right: 4px; }
.tabla-ctx td { white-space: nowrap; }
.tabla-ctx .mini { width: 140px; height: 18px; display: block; }
@media (max-width: 640px) { .comp-fila { grid-template-columns: 1fr; } .comp-fila .d { grid-column: 1; } }

/* buscador */
.buscador { display: grid; gap: 8px; margin-top: -24px; }
.barra-busqueda { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.buscador input[type=search] { width: 100%; font: 500 1rem var(--body); padding: 9px 12px; border: 2px solid var(--ink); border-radius: 2px;
  background: var(--paper); color: var(--ink); }
.barra-busqueda button, .ver-mas { font: 600 0.9rem var(--body); padding: 10px 16px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper);
  border-radius: 2px; cursor: pointer; }
.ver-mas { justify-self: start; margin-top: 10px; background: transparent; color: var(--ink); }
.res:empty { display: none; }
.buscador input[type=search]:focus-visible { outline: 3px solid var(--abst); outline-offset: 2px; }
.res { display: grid; }
.res-item { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 4px 20px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.res-item .meta { font: 0.78rem/1.45 var(--acta); color: var(--ink-2); }
.res-item mark { background: color-mix(in oklab, var(--abst) 35%, transparent); color: inherit; padding: 0 2px; }
.res-item .q { font-weight: 600; }
@media (max-width: 640px) { .res-item { grid-template-columns: 1fr; } }

/* etiquetas de tema */
.temas-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tema-tag { font: 0.72rem/1 var(--acta); padding: 4px 6px; border-radius: 2px; background: var(--paper-2); color: var(--ink-2); border: 0; cursor: pointer; }
.tema-tag:hover { color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font: 0.84rem var(--body); padding: 6px 10px; border: 1px solid var(--rule); background: transparent; color: var(--ink); border-radius: 2px; cursor: pointer; }
.chips button b { font-family: var(--acta); font-weight: 700; margin-left: 4px; color: var(--ink-2); }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chips button[aria-pressed="true"] b { color: var(--paper); }
.subtit { font: 800 1.15rem/1.1 var(--display); text-transform: uppercase; margin-top: 8px; }

/* mapa */
.mapa-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.mapa svg { width: 100%; height: auto; display: block; }
.prov { stroke: var(--paper); stroke-width: 2; cursor: pointer; }
.prov:hover, .prov.sel { stroke: var(--ink); stroke-width: 2.5; }
.mapa text { font: 11px var(--acta); fill: var(--ink); pointer-events: none; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; }
.ranking { display: grid; gap: 6px; }
.rk { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr) 2rem; gap: 10px; align-items: center; background: none; border: 0; padding: 2px 0;
  font: inherit; color: inherit; text-align: left; cursor: pointer; }
.rk .bar { height: 14px; border-radius: 0 3px 3px 0; background: var(--no); }
.rk .cero { font: 0.74rem var(--acta); color: var(--ink-2); }
.rk .n { font: 700 0.9rem var(--acta); text-align: right; }
.rk[aria-pressed="true"] .nom { text-decoration: underline; text-decoration-color: var(--no); text-decoration-thickness: 2px; }
@media (max-width: 760px) { .mapa-grid { grid-template-columns: 1fr; } }

/* sección plegable */
.plegable > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: 4px 24px;
  border-top: 2px solid var(--ink); padding-top: 12px; text-decoration: none; font: inherit; }
.plegable > summary::-webkit-details-marker { display: none; }
.plegable > summary .folio { font: 700 0.8rem/1.4 var(--acta); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
.plegable-tit { font: 800 clamp(1.7rem, 4vw, 2.5rem)/1 var(--display); text-transform: uppercase; }
.plegable-sub { grid-column: 2; font: 0.86rem var(--acta); color: var(--ink-2); }
.plegable-sub .abrir { color: var(--ink); text-decoration: underline; text-decoration-color: var(--no); text-decoration-thickness: 2px; }
.plegable[open] .abrir { font-size: 0; } .plegable[open] .abrir::after { content: "Cerrar"; font-size: 0.86rem; }
@media (max-width: 720px) { .plegable > summary { grid-template-columns: 1fr; } .plegable-sub { grid-column: 1; } }

/* agenda */
.agenda { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 28px; }
.ag-col { display: grid; gap: 8px; align-content: start; min-width: 0; }
.ag-col h3 { font: 800 1.3rem/1.1 var(--display); text-transform: uppercase; }
.ag-item { padding: 10px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 4px; }
.ag-item.cusco { box-shadow: inset 3px 0 0 var(--no); padding-left: 12px; }
.ag-item .sec { font: 0.74rem var(--acta); color: var(--ink-2); text-transform: uppercase; }
.ag-item details > summary { font: inherit; text-decoration: none; color: var(--ink); }
.ag-item details > summary::after { content: " ver más"; font: 0.78rem var(--acta); color: var(--ink-2); text-decoration: underline; }
.firma-cus { font: 0.78rem var(--acta); color: var(--no); font-weight: 700; }

/* redes */
.red svg { width: 100%; height: auto; display: block; }
.red .arista { stroke: var(--ink-2); fill: none; }
.red .nodo { stroke: var(--paper); stroke-width: 1.5; cursor: pointer; }
.red .nodo.cus { stroke: var(--ink); stroke-width: 2.5; }
.red text { font: 600 13px var(--body); fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; pointer-events: none; }
.red.foco .arista { opacity: 0.06; } .red.foco .nodo { opacity: 0.18; } .red.foco text { opacity: 0.25; }
.red.foco .on { opacity: 1 !important; }
.leyenda-banc { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.84rem; color: var(--ink-2); }
.leyenda-banc svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 5px; }
.matriz td.celda { text-align: center; font: 700 0.86rem var(--acta); min-width: 4.2rem; }
.afin svg { width: 100%; max-width: 520px; height: auto; display: block; }
.afin text { font: 600 13px var(--body); fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; }
.afin .pct { font: 700 12px var(--acta); fill: var(--ink-2); }

/* tablas */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th { font: 700 0.74rem/1.3 var(--acta); text-transform: uppercase; color: var(--ink-2); text-align: left; padding: 8px 10px; border-bottom: 2px solid var(--ink); }
td { padding: 9px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.c, th.c { text-align: center; }
td.when { font: 0.8rem/1.4 var(--acta); color: var(--ink-2); white-space: nowrap; }
td.asunto { min-width: 260px; max-width: 560px; }
tr.split td:first-child { box-shadow: inset 3px 0 0 var(--abst); }
.voto { font: 700 0.8rem/1 var(--acta); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.voto::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--c, var(--vacio)); }

.filtros { display: flex; flex-wrap: wrap; gap: 6px; }
.filtros button { font: 0.82rem var(--acta); padding: 6px 12px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; border-radius: 2px; }
.filtros button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
details > summary { cursor: pointer; font: 0.86rem var(--acta); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }

/* ficha */
.ficha-head { display: grid; gap: 10px; }
.ficha-head h1 { font: 800 clamp(3rem, 9vw, 6rem)/0.88 var(--display); text-transform: uppercase; }
.volver { font: 0.86rem var(--acta); }
.resumen-prosa { font-size: 1.15rem; line-height: 1.55; max-width: 60ch; }
.resumen-prosa b { font-weight: 600; }
.cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 28px; }
.cifra { display: grid; gap: 10px; align-content: start; }

/* tooltip */
#tip { position: fixed; z-index: 10; pointer-events: none; max-width: 300px; background: var(--ink); color: var(--paper);
  padding: 8px 10px; font: 0.8rem/1.4 var(--body); border-radius: 3px; }
#tip b { font-family: var(--acta); }

footer { display: grid; gap: 14px; font-size: 0.9rem; color: var(--ink-2); }
footer h2 { font: 800 1.4rem/1 var(--display); text-transform: uppercase; color: var(--ink); }

ras": 281, "tema": "Debate con el Gabinete", "resumen": "Responsabilizó al Congreso anterior por la crisis (vacancias, \"leyes pro crimen\", exoneraciones tributarias) y criticó que el nuevo gobierno recurra a los mismos actores. Pidió atención para Cusco y la ejecución del Gasoducto Sur Peruano.", "cita": "El Cusco, la región de la cual yo vengo, exige también consideración, respeto y emergencia.", "cusco": true, "procedimiento": false}, {"temas": ["control", "seguridad"], "provincias": ["LA CONVENCION"], "congresista": "226", "camara": "D", "fecha": "2026-08-20", "fuente": "https://diputados.congreso.gob.pe/wp-content/uploads/2026/08/PLO-2026-5-DIPUTADOS.pdf#page=54", "pagina": 54, "palabras": 370, "tema": "Debate con el Gabinete", "resumen": "Habló en parte en quechua. Atribuyó la crisis a los políticos tradicionales, reclamó justicia para las víctimas de las protestas y pidió atención al VRAEM, \"30 años en estado de emergencia\". Cuestionó el pedido de facultades legislativas.", "cita": "Mi pueblo, el Vraem, 30 años en estado de emergencia y nunca ha sido atendido.", "cusco": true, "procedimiento": false}, {"temas": ["seguridad", "obras"], "provincias": ["URUBAMBA"], "congresista": "205", "camara": "D", "fecha": "2026-08-20", "fuente": "https://diputados.congreso.gob.pe/wp-content/uploads/2026/08/PLO-2026-5-DIPUTADOS.pdf#page=58", "pagina": 58, "palabras": 263, "tema": "Debate con el Gabinete", "resumen": "Criticó la estrategia de seguridad del gobierno, pidió destituir al comandante general de la PNP y derogar las \"leyes pro crimen\". Exigió destrabar el Gasoducto Sur Andino y el aeropuerto de Chinchero.", "cita": "Exigimos inmediato destrabamiento y continuidad del Gasoducto Sur Andino, el aeropuerto Chinchero.", "cusco": true, "procedimiento": false}, {"temas": ["seguridad"], "provincias": [], "congresista": "175", "camara": "D", "fecha": "2026-08-20", "fuente": "https://diputados.congreso.gob.pe/wp-content/uploads/2026/08/PLO-2026-5-DIPUTADOS.pdf#page=116", "pagina": 116, "palabras": 406, "tema": "Debate con el Gabinete", "resumen": "Coincidió con el diagnóstico de inseguridad del premier, pero pidió metas y plazos medibles y un plan contra la corrupción dentro de la Policía. Recordó que ya existe marco legal para actuar, por ejemplo en los penales.", "cita": "La seguridad no se va a medir por cuántos operativos hicieron, ni por cuánto presupuesto ejecutaron.", "cusco": false, "procedimiento": false}, {"temas": ["seguridad", "economia"], "provincias": [], "congresista": "305", "camara": "S", "fecha": "2026-09-09", "fuente": "https://senado.congreso.gob.pe/wp-content/uploads/2026/10/09-09-2026-PLO-2026-5-SENADO-REEMPLAZO-1.pdf#page=92", "pagina": 92, "palabras": 105, "tema": "Comisión especial de seguridad ciudadana", "resumen": "Explicó por qué votó en contra de crear la comisión especial de seguridad ciudadana: el presupuesto para seguridad bajó, siguen vigentes las \"leyes pro crimen\" y hay casos de derechos humanos sin justicia.", "cita": "He votado en contra porque no entiendo la racionalidad ni la coherencia en la constitución de esta comisión.", "cusco": false, "procedimiento": false}, {"temas": ["exterior", "seguridad"], "provincias": [], "congresista": "305", "camara": "S", "fecha": "2026-09-09", "fuente": "https://senado.congreso.gob.pe/wp-content/uploads/2026/10/09-09-2026-PLO-2026-5-SENADO-REEMPLAZO-1.pdf#page=103", "pagina": 103, "palabras": 183, "tema": "Escudo de las Américas", "resumen": "Cuestionó el acuerdo de seguridad \"Escudo de las Américas\" con Estados Unidos: dijo que responde a intereses comerciales de ese país y que debilita a las Fuerzas Armadas y la Policía peruanas.", "cita": "Damos prioridad a un apoyo internacional muy dudoso.", "cusco": false, "procedimiento": false}, {"temas": ["seguridad"], "provincias": [], "congresista": "205", "camara": "D", "fecha": "2026-09-10", "fuente": "https://diputados.congreso.gob.pe/wp-content/uploads/2026/10/PLO-2026-7-DIPUTADOS-vespertino.pdf#page=10", "pagina": 10, "palabras": 579, "tema": "Interpelación al ministro del Interior", "resumen": "Sustentó la moción de su bancada para interpelar al ministro del Interior, César Astudillo, por \"ineptitud comprobada\" ante el aumento de asesinatos y sicariato. Cerró con un mensaje en quechua.", "cita": "No dejemos que muchas madres y padres sigan derramando lágrimas.", "cusco": false, "procedimiento": false}, {"temas": ["seguridad"], "provincias": [], "congresista": "205", "camara": "D", "fecha": "2026-09-10", "fuente": "https://diputados.congreso.gob.pe/wp-content/uploads/2026/10/PLO-2026-7-DIPUTADOS-vespertino.pdf#page=12", "pagina": 12, "palabras": 82, "tema": "Interpelación al ministro del Interior", "resumen": "En medio de un altercado en el Pleno, pidió calma y volvió a reclamar la derogación de las \"leyes pro crimen\", que atribuyó al fujimorismo.", "cita": "La realidad, la verdad altera.", "cusco": false, "procedimiento": false}, {"temas": ["seguridad", "control"], "provincias": [], "congresista": "175", "camara": "D", "fecha": "2026-09-10", "fuente": "https://diputados.congreso.gob.pe/wp-content/uploads/2026/10/PLO-2026-7-DIPUTADOS-vespertino.pdf#page=13", "pagina": 13, "palabras": 188, "tema": "Interpelación al ministro del Interior", "resumen": "Lamentó la confrontación en el Pleno y pidió pasar a votar la interpelación para que el ministro responda pronto.", "cita": "Parece que lo único que hemos aprendido todos estos años es confrontación.", "cusco": false, "procedimiento": false}, {"temas": ["exterior"], "provincias": [], "congresista": "305", "camara": "S", "fecha": "2026-09-16", "fuente": "https://senado.congreso.gob.pe/wp-content/uploads/2026/09/PLO-2026-6-SENADO-1.pdf#page=54", "pagina": 54, "palabras": 597, "tema": "Escudo de las Américas", "resumen": "Volvió a cuestionar el Escudo de las Américas: comparó el comercio con China y con Estados Unidos y pidió resultados medibles de la cooperación antidrogas estadounidense. Propuso buscar otros socios.", "cita": "Nosotros, como peruanos, también tenemos nuestros propios intereses que debemos defender.", "cusco": false, "procedimiento": false}, {"temas": [], "provincias": [], "congresista": "305", "camara": "S", "fecha": "2026-09-16", "fuente": "https://senado.congreso.gob.pe/wp-content/uploads/2026/09/PLO-2026-6-SENADO-1.pdf#page=56", "pagina": 56, "palabras": 8, "tema": "Orden del debate", "resumen": "Aviso de procedimiento: indicó que se había cedido un turno de palabra.", "cita": "Presidente, ha habido un cambio. Se ha cedido.", "cusco": false, "procedimiento": true}, {"temas": ["economia"], "provincias": [], "congresista": "305", "camara": "S", "fecha": "2026-09-16", "fuente": "https://senado.congreso.gob.pe/wp-content/uploads/2026/09/PLO-2026-6-SENADO-1.pdf#page=101", "pagina": 101, "palabras": 561, "tema": "Presidencia del Banco Central de Reserva", "resumen": "En la ratificación del presidente del BCR, reconoció su gestión pero defendió renovar el cargo: dijo que la autonomía es de la institución y no de la persona, y que la política monetaria favorece al gran capital por encima de las mype.", "cita": "La autonomía del Banco Central de Reserva del Perú es un atributo del marco institucional, no de la persona.", "cusco": false, "procedimiento": false}, {"temas": ["seguridad"], "provincias": [], "congresista": "205", "camara": "D", "fecha": "2026-09-17", "fuente": "https://diputados.congreso.gob.pe/wp-content/uploads/2026/10/PLO-2026-8-DIPUTADOS.pdf#page=15", "pagina": 15, "palabras": 649, "tema": "Interpelación al ministro del Interior", "resumen": "Durante la interpelación dijo que el ministro no presentó un plan estratégico, atribuyó el aumento del crimen a cambios legales impulsados desde 2016 y le preguntó por reportes periodísticos sobre vínculos de la banda \"La Jauría\" con la Policía.", "cita": "Tenemos un Ministerio del Interior a la deriva.", "cusco": false, "procedimiento": false}, {"temas": ["seguridad"], "provincias": [], "congresista": "201", "camara": "D", "fecha": "2026-09-17", "fuente": "https://diputados.congreso.gob.pe/wp-content/uploads/2026/10/PLO-2026-8-DIPUTADOS.pdf#page=25", "pagina": 25, "palabras": 208, "tema": "Interpelación al ministro del Interior", "resumen": "Por la bancada Obras, pidió al ministro resultados verificables (capturas y desarticulación de bandas) en lugar de diagnósticos, y dijo que la interpelación busca respuestas, no confrontación.", "cita": "Los delincuentes no esperan, los ciudadanos tampoco.", "cusco": false, "procedimiento": false}, {"temas": ["seguridad", "control"], "provincias": [], "congresista": "175", "camara": "D", "fecha": "2026-09-17", "fuente": "https://diputados.congreso.gob.pe/wp-content/uploads/2026/10/PLO-2026-8-DIPUTADOS.pdf#page=35", "pagina": 35, "palabras": 211, "tema": "Interpelación al ministro del Interior", "resumen": "Reconoció que el ministro mostró resultados \"debatibles\" y le pidió indicadores, metas y plazos concretos para medir su gestión.", "cita": "¿Cuáles van a ser los indicadores? ¿Cuáles las metas concretas y en qué plazos?", "cusco": false, "procedimiento": false}, {"temas": ["desastres", "agro"], "provincias": ["CALCA", "CANAS", "CHUMBIVILCAS", "ESPINAR", "URUBAMBA"], "congresista": "205", "camara": "D", "fecha": "2026-10-06", "fuente": "https://diputados.congreso.gob.pe/wp-content/uploads/2026/10/PLO-2026-9-DIPUTADOS.pdf#page=5", "pagina": 5, "palabras": 189, "tema": "Incendios forestales en Cusco", "resumen": "Alertó sobre los incendios en Urubamba, Espinar, Chumbivilcas, Canas y Calca, con dos jóvenes fallecidos. Pidió acción inmediata al Midagri, al Gobierno Regional y a los municipios, y un minuto de silencio.", "cita": "Solicito sensibilidad por parte de las autoridades y actuar de manera inmediata.", "cusco": true, "procedimiento": false}, {"temas": ["agro", "desastres"], "provincias": ["CHUMBIVILCAS"], "congresista": "205", "camara": "D", "fecha": "2026-10-06", "fuente": "https://diputados.congreso.gob.pe/wp-content/uploads/2026/10/PLO-2026-9-DIPUTADOS.pdf#page=31", "pagina": 31, "palabras": 1369, "tema": "Facultades legislativas al Ejecutivo (PL 98)", "resumen": "Sustentó el dictamen en minoría de su bancada para archivar el pedido de facultades legislativas: dijo que no cumple los requisitos del artículo 104 de la Constitución y que pone en riesgo derechos laborales, tierras comunales, el agua y las cabeceras de cuenca. Mencionó heladas y friaje en Chumbivilcas.", "cita": "No podemos en absoluto firmar de manera irresponsable un cheque en blanco.", "cusco": true, "procedimiento": false}, {"temas": ["seguridad"], "provincias": [], "congresista": "201", "camara": "D", "fecha": "2026-10-06", "fuente": "https://diputados.congreso.gob.pe/wp-content/uploads/2026/10/PLO-2026-9-DIPUTADOS.pdf#page=57", "pagina": 57, "palabras": 461, "tema": "Facultades legislativas al Ejecutivo (PL 98)", "resumen": "Argumentó que no hace falta delegar facultades para que las Fuerzas Armadas apoyen a la Policía, porque el marco legal (Decreto Legislativo 1095, actualizado en abril) ya lo permite con límites constitucionales.", "cita": "Una necesidad operativa del Estado no es lo mismo que otorgar nuevas facultades normativas al Ejecutivo.", "cusco": false, "procedimiento": false}, {"temas": ["seguridad", "desastres"], "provincias": [], "congresista": "175", "camara": "D", "fecha": "2026-10-06", "fuente": "https://diputados.congreso.gob.pe/wp-content/uploads/2026/10/PLO-2026-9-DIPUTADOS.pdf#page=81", "pagina": 81, "palabras": 416, "tema": "Facultades legislativas al Ejecutivo (PL 98)", "resumen": "Defendió la propuesta de su bancada de dar facultades solo en seguridad ciudadana y Fenómeno El Niño, y pidió al Senado no reincorporar lo que la Cámara de Diputados rechace.", "cita": "Nosotros pasaremos, pero las instituciones quedan.", "cusco": false, "procedimiento": false}, {"temas": ["control"], "provincias": [], "congresista": "201", "camara": "D", "fecha": "2026-10-06", "fuente": "https://diputados.congreso.g amentario Ahora Nación; Chipana Condori, Fernández González, Flores Valdizan, Guillén Valencia, Márquez Huanca, Palomino Casavilca, Palomino Pacheco, Pérez Alccahuaman, Poma Huamani, Tito Rojas y Zunini Yerren, del Grupo Parlamentario Juntos por el Perú; Camargo Porta y Piñán Mamani, del Grupo Parlamentario Partido Cívico Obras, mediante la cual proponen que la Cámara de Diputados interpele al ministro de Educación, señor José Antonio Chang Escobedo, para que se presente ante el Pleno de la Cámara de Diputados y responda el pliego interpelatorio de cuarenta y cuatro (44) preguntas que forma parte integrante de la presente moción. Moción presentada el 21 de setiembre de 2026. El pliego interpelatorio consta de 44 preguntas. La Junta de Portavoces, en sesión del 29 de setiembre de 2026, tomó conocimiento de la moción y la incluyó en la Agenda del Pleno. Con fecha 23 de setiembre de 2026, el diputado Guillén Valencia se adhirió a la moción. Con fecha 30 de setiembre y 1 de octubre de 2026, los diputados Sonco Villanueva, Eusebio Padilla y Medina Stein retiraron su firma de la moción, respectivamente. Con fecha 2 de octubre de 2026, el diputado Cabrera Nieto retiró su firma de la moción.", "temas": ["control", "educacion"], "cusqueños": ["192", "205"], "provincias": [], "menciona_cusco": false}, {"seccion": "Invitación a ministros de estado", "texto": "En la sesión del Pleno del 10 de setiembre de 2026, se admitió a debate y aprobó la Moción de Orden del Día 186 , que propone invitar a informar ante la Cámara de Diputados al presidente del Consejo de Ministros, señor Luis Fernando Galarreta Velarde; al ministro del Interior, señor César Augusto Astudillo Salcedo ; y al ministro de Defensa, señor Rafael Belaúnde Llosa. Pendiente de aprobar fecha y hora para la concurrencia de los ministros de Estado.", "temas": ["seguridad", "control"], "cusqueños": [], "provincias": [], "menciona_cusco": false}, {"seccion": "Comisiones de investigación", "texto": "Moción 26, de los diputados Holguín Loaiza, Colchado Huamani, Marcelo Salazar y Meneses Crispin, del Grupo Parlamentario Ahora Nación, mediante la cual proponen que la Cámara de Diputados cree una comisión investigadora que analice los hechos suscitados y determine las responsabilidades políticas y, de ser el caso, formule las denuncias correspondientes por las graves afectaciones a los derechos humanos, tales como la vida, la integridad fí sica y el derecho a la protesta, ocurridas desde el 7 de diciembre de 2022 hasta el 17 de febrero de 2026, durante los mandatos presidenciales de Dina Boluarte y José Jerí Oré. Moción presentada el 10 de agosto de 2026. Plazo solicitado: 90 días hábiles. La Junta de Portavoces, en sesión del 8 de setiembre de 2026, tomó conocimiento de la moción y la incluyó en la Agenda del Pleno.", "temas": ["derechos", "congreso"], "cusqueños": ["192"], "provincias": [], "menciona_cusco": false}, {"seccion": "Comisiones de investigación", "texto": "Moción 40, de los diputados Avendaño Vilca, Zunini Yerren, Ambrosio Domínguez, Holguín Aguirre, Fernández González, Flores Valdizan, Guevara Ramírez, Jibaja Ramos, Paredes Navarro, Lavado Valdivia, Peña Córdova y Poma Huamani, del Grupo Parlamentario Juntos por el P erú, mediante la cual proponen que la Cámara de Diputados constituya una Comisión investigadora multipartidaria denominada “Comisión de la verdad y justicia para esclarecer las muertes de líderes de pueblos originarios, activistas y defensores ambientales”, encargada de investigar, desde el 1 de enero de 2012 has ta la culminación de sus funciones, las circunstancias, antecedentes, amenazas, medidas de protección, actuaciones, omisiones y demás hechos vinculados con asesinatos, muertes violentas, desapariciones, agresiones, hostigamientos, criminalización y otros a ctos de violencia contra líderes de pueblos originarios, activistas, defensores ambientales, territoriales, comunales y de derechos humanos en el Perú. Esta comisión estaría conformada por un repre function iconoMarca() {

function tocapu() {
  // Motivo escalonado inspirado en los tocapus incas: un módulo de 18×18 que se repite.

    <defs><pattern id="tq" width="36" height="18" patternUnits="userSpaceOnUse">
      <rect width="36" height="18" style="fill:var(--ink)"/>
      <path d="M2 16h4v-4h4v-4h4v-4h4v12z" style="fill:var(--no)"/>

      <rect x="22" y="12" width="4" height="4" style="fill:var(--paper)"/>
      <rect x="10" y="2" width="4" height="4" style="fill:var(--paper)"/>
    </pattern></defs>
    <rect width="360" height="18" fill="url(#tq)"/></svg>`;
}

function cifras(c) {
  const ev = DATOS.eventos.filter(e => e.camara === c.camara);
  const asis = ev.filter(e => e.tipo === "ASISTENCIA").map(e => e.votos[c.id]);
  const vots = ev.filter(e => e.tipo === "VOTACIÓN").map(e => e.votos[c.id]);
  const n = k => vots.filter(v => v === k).length;
  const presidio = n("***"), votables = vots.length - presidio;
  const participo = n("SI") + n("NO") + n("ABST");
  const roles = DATOS.proyectos.map(p => p.cusco[c.id]).filter(Boolean);
  return { asis, pases: asis.length, presente: asis.filter(v => v === "PRE" || v === "***").length,
    votables, participo, presidio, si: n("SI"), no: n("NO"), abst: n("ABST"), sinVoto: votables - participo,
    autor: roles.filter(r => r === "Autor principal").length, coautor: roles.filter(r => r !== "Autor principal").length,
    habla: DATOS.intervenciones.filter(i => i.congresista === c.id && !i.procedimiento).length };
}

function apilada(k) {
  const tot = k.votables || 1;
  const seg = (v, col, nom) => v ? `<i style="flex:${v};background:${col}" data-tip="<b>${v}</b> ${nom} de ${k.votables} votaciones"></i>` : "";
  return `<div class="stack" role="img" aria-label="${k.si} a favor, ${k.no} en contra, ${k.abst} abstenciones, ${k.sinVoto} sin votar">
      ${seg(k.si, "var(--si)", "a favor")}${seg(k.no, "var(--no)", "en contra")}${seg(k.abst, "var(--abst)", "abstenciones")}${seg(k.sinVoto, "var(--vacio)", "sin votar")}</div>
    <div class="stack-lab"><span><b>${k.si}</b> a favor</span><span><b>${k.no}</b> en contra</span><span><b>${k.abst}</b> abst.</span><span><b>${k.sinVoto}</b> sin votar</span></div>`;
}

function pases(k, c) {
  const ev = DATOS.eventos.filter(e => e.camara === c.camara && e.tipo === "ASISTENCIA");
  return `<div class="pases" role="img" aria-label="Presente en ${k.presente} de ${k.pases} pases de lista">${ev.map(e => {
    const v = e.votos[c.id], ok = v === "PRE" || v === "***";
    return `<i class="${ok ? "" : "no"}" data-tip="<b>${fecha(e.fecha)} · ${esc(e.hora || "")}</b><br>${esc(LARGO[v] || v)}"></i>`;
  }).join("")}</div>`;
}

/* El tejido: filas = congresistas, columnas = votaciones en orden; cada sesión separada por un hueco. */
function tejido(lista, camara) {
  const vots = DATOS.eventos.filter(e => e.camara === camara && e.tipo === "VOTACIÓN");
  const C = 18, G = 3, SG = 10, X0 = 116, Y0 = 64;
  let x = X0, prev = null; const cols = [];
  vots.forEach(e => { if (prev && e.fecha !== prev) x += SG; cols.push({ e, x, nueva: e.fecha !== prev }); x += C + G; prev = e.fecha; });
  const W = x + 8, H = Y0 + lista.length * (C + G) + 6;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Voto de cada congresista en cada votación del Pleno">`;
  cols.forEach(col => {
    if (col.nueva) s += `<text transform="translate(${col.x + 4},${Y0 - 8}) rotate(-55)">${fechaCorta(col.e.fecha)}</text>`;
    const emit = lista.map(c => col.e.votos[c.id]).filter(v => ["SI", "NO", "ABST"].includes(v));
    if (lista.length > 1 && new Set(emit).size > 1) s += `<rect x="${col.x}" y="${Y0 - 5}" width="${C}" height="3" style="fill:var(--abst)"/>`;
  });
  lista.forEach((c, r) => {
    const y = Y0 + r * (C + G);
    s += `<text class="nombre" x="${X0 - 10}" y="${y + 13}" text-anchor="end">${esc(apellido(c))}</text>`;
    cols.forEach(col => {
      const v = col.e.votos[c.id];
      const cls = v === "***" ? "f-pres" : ["SI", "NO", "ABST"].includes(v) ? "f-" + v : "f-otro";
      s += `<rect class="cell ${cls}" x="${col.x}" y="${y}" width="${C}" height="${C}" rx="2"
        data-tip="<b>${esc(esc(c.corto))} · ${esc(LARGO[v] || v)}</b><br>${fecha(col.e.fecha)}, ${esc(col.e.hora || "")}<br>${esc(esc(capital(col.e.asunto).slice(0, 160)))}…"/>`;
    });
  });
  return s + "</svg>";
}

function filaVoto(e, ids, marcar) {
  const emit = ids.map(i => e.votos[i]).filter(v => ["SI", "NO", "ABST"].includes(v));
  return `<tr class="${marcar && new Set(emit).size > 1 ? "split" : ""}">
    <td class="when">${fecha(e.fecha)}<br>${esc(e.hora || "")}</td>
    <td class="asunto">${asunto(e.asunto)}</td>

}

function asunto(t) {
  t = capital(t || "Sin asunto en el acta");
  return t.length <= 170 ? esc(t) : `<details><summary>${esc(t.slice(0, 160).replace(/\s+\S*$/, ""))}…</summary>${esc(t)}</details>`;
}

function encabezado(folio, titulo, texto, id) {

function leyendaVotos(conPresidia) {

    return { c, d: n("directa"), i: n("indirecta"), na: n("nacional"), tot: prop.length };

  const max = Math.max(...filas.map(f => f.tot), 1);
  return `<div class="legend"><span><i style="--c:var(--r1)"></i>Relación directa con Cusco</span><span><i style="--c:var(--r2)"></i>Indirecta</span><span><i style="--c:var(--r3)"></i>Alcance nacional</span></div>

      <div class="track" style="width:${100 * f.tot / max}%">${[[f.d, "--r1", "con relación directa"], [f.i, "--r2", "con relación indirecta"], [f.na, "--r3", "de alcance nacional"]]

    <div class="lista">${DATOS.intervenciones.filter(i => i.cusco).reverse().map(i => intervencion(i, true, false)).join("")}</div>

  </section>

}

function ficha(c) {
  const k = cifras(c);
  const propios = DATOS.proyectos.filter(p => p.cusco[c.id] === "Autor principal");
  const coaut = DATOS.proyectos.filter(p => p.cusco[c.id] && p.cusco[c.id] !== "Autor principal");
  const vots = DATOS.eventos.filter(e => e.camara === c.camara && e.tipo === "VOTACIÓN").reverse();
  return `
  <a class="volver" href="#inicio">← Volver al padrón</a>
  <header class="ficha-head">
    <span class="etq">${CAMARA[c.camara]} · ${esc(c.partido)}</span>
    <h1>${esc(c.corto)}</h1>
    <span class="acta muted small">${esc(c.nombre)}</span>
  </header>
  ${tocapu()}
  <p class="resumen-prosa">Desde julio de 2026 estuvo presente en <b>${k.presente} de ${k.pases}</b> pases de lista del Pleno y votó en <b>${k.participo} de ${k.votables}</b> votaciones: ${k.si} a favor, ${k.no} en contra y ${k.abst} abstenciones${k.presidio ? `; en otras ${k.presidio} presidía la sesión y no votaba` : ""}. Es autor principal de <b>${k.autor}</b> ${k.autor === 1 ? "proyecto" : "proyectos"} de ley y firmó otros ${k.coautor} como coautor. En el Diario de Debates figura con <b>${k.habla}</b> ${k.habla === 1 ? "intervención" : "intervenciones"} como orador${DATOS.presidio[c.id] ? ` y ${DATOS.presidio[c.id]} turnos presidiendo la sesión` : ""}.</p>

  <div class="cifras">
    <div class="cifra"><span class="etq">Pases de lista</span>${pases(k, c)}</div>
    <div class="cifra"><span class="etq">Reparto de sus votos</span>${apilada(k)}</div>
  </div>

  ${contexto(c)}
  ${temasDe(c)}
  ${seccionMapa(c.id)}

  <section class="sec" aria-labelledby="t-sus">
    ${encabezado("Pleno", "Su tejido de votos", "Cada cuadro es una votación, en orden de fecha.", "t-sus")}
    ${leyendaVotos(k.presidio > 0)}
    <div class="tejido">${tejido([c], c.camara)}</div>
  </section>

  <section class="sec" aria-labelledby="t-dijo">
    ${encabezado("Diario de Debates", "Lo que dijo en el Pleno", "Resumen de cada intervención, con una cita textual y el enlace a la página de la transcripción oficial. Debajo, cómo votó ese mismo día.", "t-dijo")}
    ${(() => { const mias = DATOS.intervenciones.filter(i => i.congresista === c.id).reverse();
      return mias.length ? `<div class="lista">${mias.map(i => intervencion(i, false, true)).join("")}</div>` : `<p class="muted">No figura con intervenciones como orador en las transcripciones publicadas.</p>`; })()}
  </section>

  <section class="sec" aria-labelledby="t-propios">
    ${encabezado("Autor principal", "Proyectos que presentó", "Proyectos en los que es el primer firmante. El resumen sale de leer el texto completo.", "t-propios")}
    ${propios.length ? `<div class="lista">${propios.map(p => proyecto(p, false)).join("")}</div>`
      : `<p class="muted">${c.camara === "S" ? "En el Congreso bicameral los proyectos de ley se presentan casi siempre en la Cámara de Diputados; el Senado los revisa. Por eso la labor del senador se ve sobre todo en sus votaciones." : "Todavía no presentó proyectos como autor principal."}</p>`}
    ${coaut.length ? `<details><summary>Ver los ${coaut.length} proyectos que firmó como coautor</summary><div class="lista">${coaut.map(p => `
      <div class="item"><div class="exp"><a href="${esc(p.pdf)}" target="_blank" rel="noopener">${esc(p.numero.split("-")[0])}</a><br>${fecha(p.fecha)}</div>
      <div class="txt"><span class="small">${esc(capital(p.titulo.replace(/^PROPOSICI[ÓO]N (DE RESOLUCI[ÓO]N )?LEGISLATIVA (DEL CONGRESO )?(QUE )?/, "")))}</span>
      <span class="nota">Autor: ${esc(p.autor.split(",")[0])} · ${esc(capital(p.estado))}</span></div></div>`).join("")}</div></details>` : ""}
  </section>

  <section class="sec" aria-labelledby="t-votos">
    ${encabezado("Pleno", "Cada votación", `Del acta oficial. "Por constancia" indica que el sistema no registró su voto o asistencia y la presidencia lo dejó constando en el acta.`, "t-votos")}
    <div class="filtros" role="group" aria-label="Filtrar sus votos">
      ${[["todas", "Todas"], ["NO", "En contra"], ["ABST", "Abstenciones"], ["sin", "No votó"]].map(([f, t], i) =>
        `<button type="button" id="v-${f}" data-v="${f}" aria-pressed="${i === 0}">${t}</button>`).join("")}</div>
    <div class="scroll"><table><thead><tr><th>Fecha</th><th>Asunto</th><th class="c">Voto</th><th class="c">Fuente</th></tr></thead>
      <tbody id="votos">${vots.map(e => filaVoto(e, [c.id], false)).join("")}</tbody></table></div>
  </section>
  ${tocapu()}
  ${pie()}`;
}

function proyecto(p, conAutor) {
  const r = p.resumen, paso = p.ultimo;
  const autor = conAutor ? DATOS.congresistas.find(c => p.cusco[c.id] === "Autor principal") : null;
  return `<article class="item">
    <div class="exp"><a href="${esc(p.pdf)}" target="_blank" rel="noopener">${esc(p.numero.replace("-2026-2031-CD", ""))}</a><br>${fecha(p.fecha)}<br>${esc(capital(p.estado))}
      ${r ? `<br><span class="pill">${r.cusco === "nacional" ? "Nacional" : r.cusco === "directa" ? "Cusco: directa" : "Cusco: indirecta"}</span>` : ""}</div>
    <div class="txt">
      <h3>${esc(r ? r.tema : capital(p.titulo))}${autor ? ` <span class="muted small">· ${esc(autor.corto)}</span>` : ""}</h3>
      ${r ? `<p>${esc(r.resumen)}</p>` : `<p class="nota">Resumen pendiente. Título oficial: ${esc(capital(p.titulo))}</p>`}
      ${r && r.por_que_cusco ? `<p class="nota"><b>Por qué importa en Cusco:</b> ${esc(r.por_que_cusco)}</p>` : ""}
      ${r && r.nota ? `<p class="nota"><b>Nota:</b> ${esc(r.nota)}</p>` : ""}
      ${tagsTema(p.temas)}
      ${paso && paso.comisiones ? `<p class="nota">Último paso (${fecha(paso.fecha)}): en ${esc(paso.comisiones)}</p>` : ""}
    </div></article>`;
}

function intervencion(i, conNombre, conVotos) {
  const c = DATOS.congresistas.find(x => x.id === i.congresista);
  const votos = conVotos ? DATOS.eventos.filter(e => e.camara === i.camara && e.fecha === i.fecha && e.tipo === "VOTACIÓN") : [];
  return `<article class="item">
    <div class="exp">${fecha(i.fecha)}<br><a href="${esc(i.fuente)}" target="_blank" rel="noopener">Diario de Debates, p. ${i.pagina}</a><br>${i.palabras} palabras
      ${i.cusco ? `<br><span class="pill">Menciona Cusco</span>` : ""}</div>
    <div class="txt">
      <h3>${esc(i.tema || "Intervención")}${conNombre ? ` <span class="muted small">· ${esc(c.corto)}</span>` : ""}</h3>
      ${i.resumen ? `<p>${esc(i.resumen)}</p>` : `<p class="nota">Resumen pendiente.</p>`}
      ${tagsTema(i.temas)}
      ${i.cita && !i.procedimiento ? `<blockquote class="cita">${esc(i.cita)}</blockquote>` : ""}
      ${votos.length ? `<div class="ese-dia"><span>Ese día votó:</span>${votos.map(e => { const v = e.votos[i.congresista];
        return `<span class="chip-voto" style="--c:${COLOR[v] || "var(--vacio)"}" data-tip="<b>${esc(LARGO[v] || v)}</b> · ${esc(e.hora || "")}<br>${esc(esc(capital(e.asunto).slice(0, 150)))}…">${esc(ETQ[v] || v)}</span>`; }).join("")}</div>` : ""}
    </div></article>`;
}

function quienHabla() {
  const filas = DATOS.congresistas.map(c => {
    const prop = DATOS.intervenciones.filter(i => i.congresista === c.id && !i.procedimiento);
    return { c, n: prop.length, pal: prop.reduce((a, i) => a + i.palabras, 0), pres: DATOS.presidio[c.id] || 0 };
  });
  const max = Math.max(...filas.map(f => f.pal), 1);
  return `<div class="hbars" role="img" aria-label="Palabras pronunciadas en el Pleno por cada congresista">${filas.map(f => `
    <div class="hbar"><a class="n" href="#${f.c.slug}">${esc(f.c.corto)}</a>
      <div class="track" style="width:${Math.max(100 * f.pal / max, 0.6)}%"><i style="flex:1;background:var(--ink);border-radius:0 4px 4px 0"
        data-tip="<b>${f.n}</b> ${f.n === 1 ? "intervención" : "intervenciones"} · ${f.pal.toLocaleString("es-PE")} palabras${f.pres ? `<br>Además, ${f.pres} turnos presidiendo la sesión` : ""}"></i></div>
      <span class="v">${f.n}</span></div>`).join("")}</div>
  <p class="muted small">Largo de la barra: palabras pronunciadas. Número: intervenciones como orador (sin contar avisos de procedimiento${filas.some(f => f.pres) ? " ni los turnos presidiendo la sesión" : ""}).</p>`;
}

const MARCAS = {
  yo: (x, y) => `<circle cx="${x}" cy="${y}" r="6" style="fill:var(--no);stroke:var(--paper);stroke-width:2"/>`,
  camara: (x, y) => `<circle cx="${x}" cy="${y}" r="5" style="fill:var(--paper);stroke:var(--ink);stroke-width:2"/>`,
  bancada: (x, y) => `<rect x="${x - 5}" y="${y - 5}" width="10" height="10" transform="rotate(45 ${x} ${y})" style="fill:var(--abst);stroke:var(--paper);stroke-width:1.5"/>`,
};
const pct1 = v => v == null ? "—" : `${String(Math.round(v * 10) / 10).replace(".", ",")}%`;

function puntos(valores, ancho = 400, alto = 30, ejes = true) {
  // valores: [{tipo, v, tip}] en 0–100
  const X = v => 8 + v / 100 * (ancho - 16), y = alto / 2;
  let s = `<svg viewBox="0 0 ${ancho} ${alto}" preserveAspectRatio="none" role="img">`;
  s += `<line x1="${X(0)}" x2="${X(100)}" y1="${y}" y2="${y}" style="stroke:var(--rule);stroke-width:1"/>`;
  if (ejes) [0, 50, 100].forEach(t => s += `<line x1="${X(t)}" x2="${X(t)}" y1="${y - 4}" y2="${y + 4}" style="stroke:var(--rule)"/>`);
  ["camara", "bancada", "yo"].forEach(tipo => valores.filter(v => v.tipo === tipo && v.v != null).forEach(v =>
    s += `<g data-tip="${v.tip}">${MARCAS[tipo](X(v.v), y)}</g>`));
  return s + "</svg>";
}

function leyendaContexto(c) {
  return `<div class="leyenda-comp">
    <span><svg viewBox="0 0 12 12">${MARCAS.yo(6, 6)}</svg>${c ? esc(c.corto) : "El congresista"}</span>
    <span><svg viewBox="0 0 12 12">${MARCAS.camara(6, 6)}</svg>Promedio de su cámara</span>
    <span><svg viewBox="0 0 12 12">${MARCAS.bancada(6, 6)}</svg>Promedio de su bancada</span></div>`;
}

function contexto(c) {
  const X = DATOS.contexto; if (!X) return "";
  const k = X.congresistas[c.id], cam = X.camaras[c.camara], ban = X.bancadas[`${c.camara}-${k.bancada}`];
  const nomCam = c.camara === "S" ? "el Senado" : "la Cámara de Diputados";
  const fila = (titulo, yo, camV, banV, detalle) => `<div class="comp-fila"><span class="t">${titulo}</span>
    ${puntos([{ tipo: "camara", v: camV, tip: `<b>${pct1(camV)}</b> promedio de ${nomCam}` }, { tipo: "bancada", v: banV, tip: `<b>${pct1(banV)}</b> promedio de su bancada` },
      { tipo: "yo", v: yo, tip: `<b>${pct1(yo)}</b> ${esc(c.corto)}` }])}<span class="d">${detalle}</span></div>`;
  const distintos = k.distinto.map(d => ({ d, e: DATOS.eventos.find(e => e.camara === c.camara && e.fecha === d.fecha && e.hora === d.hora && e.tipo === "VOTACIÓN") }));
  const maxPal = Math.max(k.palabras, k.promedio_palabras) * 1.6 || 1;
  return `
  <section class="sec" aria-labelledby="t-ctx">
    ${encabezado("Comparación", "En contexto", `Sus cifras frente al promedio de ${nomCam} y de su bancada, en las mismas sesiones. Se usan solo las actas cuya tabla de totales cuadra al sumarla (${cam.pases} pases de lista y ${cam.votaciones} votaciones de ${nomCam}).`, "t-ctx")}
    ${leyendaContexto(c)}
    <div class="comp">
      ${fila("Asistencia", k.asistencia, cam.asistencia, ban.asistencia, `${esc(c.corto)}: ${pct1(k.asistencia)} · cámara ${pct1(cam.asistencia)} · bancada ${pct1(ban.asistencia)}`)}
      ${fila("Votó cuando le tocaba", k.participacion, cam.participacion, null, `${k.participo} de ${k.votaciones} votaciones · cámara ${pct1(cam.participacion)}`)}
      ${fila("Votó igual que su bancada", k.con_su_bancada, cam.con_su_bancada, ban.con_su_bancada, `${pct1(k.con_su_bancada)} de ${k.comparables} votaciones · su bancada en promedio ${pct1(ban.con_su_bancada)} · cámara ${pct1(cam.con_su_bancada)}`)}
      <div class="comp-fila"><span class="t">Palabras en el Pleno</span>
        <svg viewBox="0 0 400 30" preserveAspectRatio="none" role="img"><line x1="8" x2="392" y1="15" y2="15" style="stroke:var(--rule)"/>
          <g data-tip="<b>${k.promedio_palabras.toLocaleString("es-PE")}</b> palabras: promedio por congresista">${MARCAS.camara(8 + k.promedio_palabras / maxPal * 384, 15)}</g>
          <g data-tip="<b>${k.palabras.toLocaleString("es-PE")}</b> palabras de ${esc(c.corto)}">${MARCAS.yo(8 + k.palabras / maxPal * 384, 15)}</g></svg>
        <span class="d">${k.palabras.toLocaleString("es-PE")} palabras · puesto ${k.puesto_palabras || k.miembros} de ${k.miembros} · promedio ${k.promedio_palabras.toLocaleString("es-PE")}</span></div>
    </div>
    ${distintos.length ? `<div class="sec-head" style="border-top-width:1px"><span class="folio">Detalle</span><h2 style="font-size:1.3rem">Cuando votó distinto a su bancada (${distintos.length})</h2><p>Votaciones en que su voto no coincidió con el de la mayoría de su bancada.</p></div>
      <div class="scroll"><table><thead><tr><th>Fecha</th><th>Asunto</th><th class="c">Su voto</th><th class="c">Mayoría de su bancada</th></tr></thead><tbody>
      ${distintos.map(({ d, e }) => `<tr><td class="when">${fecha(d.fecha)}<br>${esc(d.hora)}</td><td class="asunto">${e ? asunto(e.asunto) : ""}</td>
        <td class="c"><span class="voto" style="--c:${COLOR[d.voto]}">${ETQ[d.voto]}</span></td><td class="c"><span class="voto" style="--c:${COLOR[d.bancada]}">${ETQ[d.bancada]}</span></td></tr>`).join("")}
      </tbody></table></div>` : `<p class="muted">En las votaciones comparables siempre votó igual que la mayoría de su bancada.</p>`}
  </section>`;
}

function tablaContexto() {
  const X = DATOS.contexto; if (!X) return "";
  return `<section class="sec" aria-labelledby="t-ctx-todos">
    ${encabezado("Comparación", "En contexto", "Cada cusqueño frente al promedio de su cámara y de su bancada, en las mismas sesiones. Solo se usan las actas cuya tabla de totales cuadra al sumarla.", "t-ctx-todos")}
    ${leyendaContexto(null)}
    <div class="scroll"><table class="tabla-ctx"><thead><tr><th>Congresista</th><th>Asistencia</th><th></th><th>Votó igual que su bancada</th><th></th><th class="c">Palabras: puesto</th></tr></thead><tbody>
    ${DATOS.congresistas.map(c => { const k = X.congresistas[c.id], cam = X.camaras[c.camara], ban = X.bancadas[`${c.camara}-${k.bancada}`];
      const m = (yo, cv, bv) => puntos([{ tipo: "camara", v: cv, tip: `<b>${pct1(cv)}</b> promedio de la cámara` }, { tipo: "bancada", v: bv, tip: `<b>${pct1(bv)}</b> promedio de su bancada` }, { tipo: "yo", v: yo, tip: `<b>${pct1(yo)}</b> ${esc(c.corto)}` }], 140, 18, false).replace("<svg", '<svg class="mini"');
      return `<tr><td><a href="#${c.slug}">${esc(c.corto)}</a><br><span class="muted small">${c.camara === "S" ? "Senado" : "Diputados"}</span></td>
        <td class="num">${pct1(k.asistencia)}</td><td>${m(k.asistencia, cam.asistencia, ban.asistencia)}</td>
        <td class="num">${pct1(k.con_su_bancada)}</td><td>${m(k.con_su_bancada, cam.con_su_bancada, ban.con_su_bancada)}</td>
        <td class="c num acta">${k.puesto_palabras || k.miembros} de ${k.miembros}</td></tr>`; }).join("")}
    </tbody></table></div></section>`;
}

/* ---------- Temas ---------- */
const nomTema = t => DATOS.temas[t] || t;
function tagsTema(lista) {
  return lista && lista.length ? `<span class="temas-tags">${lista.map(t => `<button type="button" class="tema-tag" data-tema="${t}">${esc(nomTema(t))}</button>`).join("")}</span>` : "";
}
function itemsDeTema(tema, cid) {
  const cus = DATOS.congresistas.map(c => c.id);
  const propios = DATOS.proyectos.filter(p => (p.temas || []).includes(tema) && Object.entries(p.cusco).some(([i, r]) => r === "Autor principal" && (!cid || i === cid)));
  const dichos = DATOS.intervenciones.filter(i => (i.temas || []).includes(tema) && !i.procedimiento && (!cid || i.congresista === cid));
  const vistos = new Set();
  const votos = DATOS.eventos.filter(e => e.tipo === "VOTACIÓN" && (e.temas || []).includes(tema) && (!cid || e.votos[cid]) && !vistos.has(e.camara + e.fecha + e.hora) && vistos.add(e.camara + e.fecha + e.hora));
  return { propios, dichos, votos };
}
function seccionTemas() {
  const cuenta = Object.keys(DATOS.temas).map(t => { const x = itemsDeTema(t); return [t, x.propios.length + x.dichos.length + x.votos.length]; })
    .filter(([, n]) => n).sort((a, b) => b[1] - a[1]);
  return `<section class="sec" aria-labelledby="t-temas" id="temas">
    ${encabezado("Por tema", "Seguridad, salud, educación…", "Elige un tema para ver los proyectos que presentaron los cusqueños, lo que dijeron en el Pleno y cómo votaron. Los temas se asignan con palabras clave sobre el texto oficial.", "t-temas")}

/* ---------- Buscador ----------
   Índice local (siempre disponible, viene dentro de la página) + Diario de Debates completo
   (busqueda.json, se descarga al primer uso). Si la descarga falla, se busca solo en el local. */
let INDICE = null, INDICE_COMPLETO = false, LIMITE = 10;
const norm = t => (t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
function indiceLocal() {
  const cus = new Set(DATOS.congresistas.map(c => c.id));
  const d = DATOS.proyectos.map(p => ({ t: "proyecto", f: p.fecha, q: p.autor, h: p.resumen ? p.resumen.tema : p.titulo.slice(0, 140),
    x: `${p.titulo} ${p.resumen ? p.resumen.resumen : ""}`, u: p.pdf, c: Object.keys(p.cusco) }));
  const vistos = new Set();
  DATOS.eventos.forEach(e => { const k = e.camara + e.fecha + e.hora;
    if (e.tipo === "VOTACIÓN" && !vistos.has(k)) { vistos.add(k);
      d.push({ t: "votación", f: e.fecha, q: e.camara === "S" ? "Senado" : "Cámara de Diputados", h: e.asunto.slice(0, 140), x: e.asunto, u: e.fuente, c: Object.keys(e.votos) }); } });
  DATOS.intervenciones.forEach(i => { const c = DATOS.congresistas.find(x => x.id === i.congresista);
    d.push({ t: "diario", f: i.fecha, q: c.corto, h: i.tema || "", x: `${i.tema || ""}. ${i.resumen || ""} ${i.cita || ""}`, u: i.fuente, c: [i.congresista] }); });
  return d.map(x => ({ ...x, n: norm(`${x.h} ${x.q} ${x.x}`) }));
}
function seccionBuscador() {
  return `<section class="buscador" aria-label="Buscador" id="buscar">
    <form class="barra-busqueda" id="form-q" role="search">
      <label for="q" class="etq">Buscar</label>
      <input type="search" id="q" placeholder="Machu Picchu, agua, Espinar…" autocomplete="off">
      <button type="submit">Buscar</button>
    </form>
    <p class="acta small muted" style="margin:0">En proyectos, votaciones y todo el Diario de Debates de ambas cámaras.</p>
    <div class="chips" role="group" aria-label="Tipo de documento" id="q-tipos"></div>
    <div id="q-res" class="res" aria-live="polite"></div>
  </section>`;
}
async function cargarIndice(caja) {
  if (!INDICE) INDICE = indiceLocal();
  if (INDICE_COMPLETO !== false) return;
  INDICE_COMPLETO = null;  // cargando
  try {
    const r = await fetch(new URL("busqueda.json", location.href));
    if (!r.ok) throw new Error(r.status);
    const extra = (await r.json()).filter(d => d.t === "diario").map(d => ({ ...d, n: norm(`${d.h} ${d.q} ${d.x}`) }));
    INDICE = INDICE.filter(d => d.t !== "diario").concat(extra);  // el Diario completo reemplaza a los resúmenes
    INDICE_COMPLETO = true;
  } catch (e) { INDICE_COMPLETO = "error"; }
}
async function buscar(q, tipo, mas) {
  const caja = document.getElementById("q-res"), tipos = document.getElementById("q-tipos");
  if (!caja) return;
  LIMITE = mas ? LIMITE + 20 : 10;
  const terms = norm(q).split(/\s+/).filter(w => w.length > 1);
  if (!terms.length) { caja.innerHTML = ""; tipos.innerHTML = ""; return; }
  if (!INDICE) INDICE = indiceLocal();
  if (INDICE_COMPLETO === false) { cargarIndice().then(() => { const v = document.getElementById("q"); if (v && v.value) buscar(v.value, tipoBusqueda); }); }
  // Palabras completas (con plural): "agua" encuentra "aguas" pero no "Aguayo". Desde 6 letras, también derivados.
  const escRe = t => t.replace(/[.*+?^$()|[\]\\{}]/g, "\\$&");
  const fin = t => t.length >= 6 ? "" : "(?:s|es)?(?![a-z0-9])";
  const pruebas = terms.map(t => new RegExp(`(?<![a-z0-9])${escRe(t)}${fin(t)}`));
  const hall = INDICE.filter(d => pruebas.every(r => r.test(d.n)));
  const NOM = { proyecto: "Proyectos", "votación": "Votaciones", diario: "Diario de Debates" };
  const porTipo = {}; hall.forEach(d => porTipo[d.t] = (porTipo[d.t] || 0) + 1);
  tipos.innerHTML = hall.length ? [["", "Todo", hall.length], ...Object.entries(porTipo).map(([t, n]) => [t, NOM[t], n])]
    .map(([t, nombre, n]) => `<button type="button" data-qt="${t}" aria-pressed="${(tipo || "") === t}">${nombre}<b>${n}</b></button>`).join("") : "";
  const todos = hall.filter(d => !tipo || d.t === tipo).sort((a, b) => (b.f || "").localeCompare(a.f || ""));
  const lista = todos.slice(0, LIMITE);
  const VOCAL = { a: "[aáàä]", e: "[eéèë]", i: "[iíìï]", o: "[oóòö]", u: "[uúùü]", n: "[nñ]" };
  const patron = t => [...t].map(ch => VOCAL[ch] || ch.replace(/[.*+?^$()|[\]\\{}]/g, "\\$&")).join("");
  const recorte = d => { const n = norm(d.x), m = n.search(pruebas[0]), i = Math.max(0, m - 110);
    let s = esc(d.x.slice(i, i + 300));
    terms.forEach(t => { s = s.replace(new RegExp(`(?<!\\p{L})(${patron(t)}${t.length >= 6 ? "" : "(?:s|es)?(?!\\p{L})"})`, "giu"), "<mark>$1</mark>"); });
    return (i ? "…" : "") + s + "…"; };
  const estado = INDICE_COMPLETO === true ? "" : INDICE_COMPLETO === "error"
    ? " · el Diario de Debates completo no se pudo cargar; se busca en proyectos, votaciones y resúmenes de las intervenciones de los cusqueños"
    : " · cargando el Diario de Debates completo…";
  caja.innerHTML = (hall.length ? `<p class="acta small muted">${hall.length} resultados${estado}</p>` + lista.map(d => `<div class="res-item">
      <div class="meta">${fecha(d.f)}<br>${NOM[d.t]}</div>
      <div><div class="q">${esc(d.t === "diario" ? d.q : d.h)}${d.c.length && d.t !== "votación" ? ` <span class="pill" style="margin:0 0 0 6px">Cusco</span>` : ""}</div>
      <p class="small">${recorte(d)}</p><a class="acta small" href="${esc(d.u)}" target="_blank" rel="noopener">Ver documento oficial</a></div></div>`).join("")
      + (todos.length > LIMITE ? `<button type="button" class="ver-mas" data-mas="1">Ver más resultados (${todos.length - LIMITE} restantes)</button>` : "")
    : `<p class="muted small">Sin resultados para «${esc(q)}»${estado}.</p>`);
}

/* ---------- Redes (SNA) ---------- */
const BANCADAS = { AN: "Ahora Nación", FP: "Fuerza Popular", JP: "Juntos por el Perú", PBG: "Partido del Buen Gobierno", PCO: "Partido Cívico Obras", RP: "Renovación Popular" };
const CODIGO_PARTIDO = Object.fromEntries(Object.entries(BANCADAS).map(([k, v]) => [v, k]));
function forma(b, x, y, r, extra = "") {
  // Cada bancada con una forma distinta: el color no es el único código (lectura para daltonismo).
  const col = `fill:var(--b-${b || "x"}, var(--vacio))`;
  const pts = (n, rot) => Array.from({ length: n }, (_, i) => { const a = rot + i * 2 * Math.PI / n; return `${(x + r * Math.cos(a)).toFixed(1)},${(y + r * Math.sin(a)).toFixed(1)}`; }).join(" ");
  if (b === "FP") return `<rect x="${x - r * 0.85}" y="${y - r * 0.85}" width="${r * 1.7}" height="${r * 1.7}" style="${col}" ${extra}/>`;
  if (b === "JP") return `<polygon points="${pts(3, -Math.PI / 2)}" style="${col}" ${extra}/>`;
  if (b === "PBG") return `<polygon points="${pts(4, 0)}" style="${col}" ${extra}/>`;
  if (b === "PCO") return `<polygon points="${pts(6, 0)}" style="${col}" ${extra}/>`;
  if (b === "RP") return `<polygon points="${pts(5, -Math.PI / 2)}" style="${col}" ${extra}/>`;
  return `<circle cx="${x}" cy="${y}" r="${r}" style="${col}" ${extra}/>`;
}
function leyendaBancadas() {
  return `<div class="leyenda-banc">${Object.entries(BANCADAS).map(([b, n]) => `<span><svg viewBox="0 0 16 16">${forma(b, 8, 8, 6.5)}</svg>${n}</span>`).join("")}
    <span><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" style="fill:none;stroke:var(--ink);stroke-width:2.5"/></svg>Congresista de Cusco</span></div>`;
}
function redCoautoria() {
  const R = DATOS.redes.coautoria, cus = new Set(DATOS.congresistas.map(c => c.id));
  const pos = Object.fromEntries(R.nodos.map(n => [n.id, n]));
  const maxP = Math.max(...R.aristas.map(a => a.peso));
  const radio = n => n.cusco ? 9 + Math.sqrt(n.fuerza) * 0.9 : 3.5 + Math.sqrt(n.fuerza) * 0.9;
  return `<svg viewBox="0 0 ${R.ancho} ${R.alto}" role="img" aria-label="Red de coautoría de los congresistas de Cusco">
    ${R.aristas.map(a => { const A = pos[a.a], B = pos[a.b];
      return `<line class="arista" data-a="${a.a}" data-b="${a.b}" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" style="stroke-width:${(0.6 + 3.4 * a.peso / maxP).toFixed(2)};opacity:${(0.18 + 0.5 * a.peso / maxP).toFixed(2)}"/>`; }).join("")}
    ${[...R.nodos].sort((a, b) => a.cusco - b.cusco).map(n => {
      const enlaces = R.aristas.filter(a => a.a === n.id || a.b === n.id);
      const conCus = enlaces.filter(a => cus.has(a.a === n.id ? a.b : a.a)).map(a => { const o = a.a === n.id ? a.b : a.a; return `${esc(pos[o].nombre)}: ${a.peso}`; });
      const tip = `<b>${esc(n.completo)}</b> · ${esc(BANCADAS[n.bancada] || "")}<br>${n.cusco ? `${n.grado} coautores distintos` : `Proyectos firmados con cusqueños: ${conCus.join(" · ")}`}`;
      return forma(n.bancada, n.x, n.y, radio(n), `class="nodo ${n.cusco ? "cus" : ""}" data-n="${n.id}" data-tip="${tip}"`); }).join("")}
    ${R.nodos.filter(n => n.cusco).map(n => `<text x="${n.x}" y="${n.y - radio(n) - 7}" text-anchor="middle" data-n="${n.id}">${esc(n.nombre.split(" ")[0])}</text>`).join("")}
  </svg>`;
}
function afinidadCusquenos() {
  const A = DATOS.redes.afinidad.pares, dip = DATOS.congresistas.filter(c => c.camara === "D");
  const W = 520, H = 420, cx = W / 2, cy = H / 2 + 6, r = 150;
  const p = dip.map((c, i) => ({ c, x: cx + r * Math.cos(-Math.PI / 2 + i * 2 * Math.PI / dip.length), y: cy + r * Math.sin(-Math.PI / 2 + i * 2 * Math.PI / dip.length) }));
  const par = (a, b) => A[`${a}-${b}`] || A[`${b}-${a}`];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Porcentaje de votaciones en que cada par de diputados cusqueños votó igual">`;
  for (let i = 0; i < p.length; i++) for (let j = i + 1; j < p.length; j++) {
    const d = par(p[i].c.id, p[j].c.id); if (!d || d.pct == null) continue;
    const w = 1 + 9 * Math.max(0, (d.pct - 50) / 50);
    s += `<line x1="${p[i].x}" y1="${p[i].y}" x2="${p[j].x}" y2="${p[j].y}" style="stroke:var(--ink);stroke-width:${w.toFixed(1)};opacity:${(0.15 + 0.6 * d.pct / 100).toFixed(2)}"
      data-tip="<b>${esc(p[i].c.corto)} y ${esc(p[j].c.corto)}</b><br>Votaron igual en ${d.igual} de ${d.total} votaciones (${pct1(d.pct)})"/>`;
    const mx = (p[i].x + p[j].x) / 2, my = (p[i].y + p[j].y) / 2;
    s += `<text class="pct" x="${mx}" y="${my}" text-anchor="middle" dy="4" style="paint-order:stroke;stroke:var(--paper);stroke-width:4px">${Math.round(d.pct)}%</text>`;
  }
  p.forEach(q => { const b = CODIGO_PARTIDO[q.c.partido];
    s += forma(b, q.x, q.y, 15, `class="nodo cus" style="stroke:var(--ink);stroke-width:2.5" data-tip="<b>${esc(q.c.corto)}</b> · ${esc(q.c.partido)}"`);
    s += `<text x="${q.x}" y="${q.y + (q.y < cy ? -24 : 34)}" text-anchor="middle">${esc(apellido(q.c))}</text>`; });
  return s + "</svg>";
}
function matrizBancadas() {
  const M = DATOS.redes.afinidad.con_bancadas;
  const cols = ["AN", "FP", "JP", "PBG", "PCO", "RP"];
  return `<div class="scroll"><table class="matriz"><thead><tr><th>Congresista</th>${cols.map(b => `<th class="c" title="${BANCADAS[b]}"><svg viewBox="0 0 16 16" style="width:12px;height:12px;vertical-align:-1px;margin-right:4px">${forma(b, 8, 8, 6.5)}</svg>${b}</th>`).join("")}</tr></thead><tbody>
    ${DATOS.congresistas.map(c => { const propia = CODIGO_PARTIDO[c.partido];
      return `<tr><td><a href="#${c.slug}">${esc(c.corto)}</a><br><span class="muted small">${esc(c.partido)}</span></td>${cols.map(b => { const d = M[c.id] && M[c.id][b];
        if (!d || d.pct == null) return `<td class="celda muted">—</td>`;
        const fondo = `color-mix(in oklab, var(--ink) ${Math.round(d.pct * 0.85)}%, var(--paper-2))`, tinta = d.pct >= 55 ? "var(--paper)" : "var(--ink)";
        return `<td class="celda" style="background:${fondo};color:${tinta};${b === propia ? "box-shadow:inset 0 0 0 3px var(--no)" : ""}" data-tip="<b>${esc(c.corto)}</b> votó igual que la mayoría de ${BANCADAS[b]} en ${d.igual} de ${d.total} votaciones">${Math.round(d.pct)}%</td>`; }).join("")}</tr>`; }).join("")}
  </tbody></table></div>
  <p class="muted small">Recuadro rojo: su propia bancada. Celdas más oscuras: más coincidencia. Solo cuentan las votaciones cuya tabla de totales por bancada cuadra al sumarla.</p>`;
}
function tablaSNA() {
  const R = DATOS.redes.coautoria;
  return `<div class="scroll"><table><thead><tr><th>Congresista</th><th class="c">Coautores distintos</th><th class="c">Firmas de colegas por proyecto propio</th><th class="c">Firmas con otras bancadas</th><th>Con quién firma más</th><th class="c">Intermediación</th></tr></thead><tbody>
    ${DATOS.congresistas.map(c => { const m = R.metricas[c.id]; if (!m) return "";
      return `<tr><td><a href="#${c.slug}">${esc(c.corto)}</a></td><td class="c num acta">${m.coautores}</td><td class="c num acta">${m.firmas_por_proyecto ?? "—"}</td>
        <td class="c num acta">${pct1(m.fuera_de_bancada)}</td>
        <td class="small">${m.socios.map(x => `${esc(x.nombre.split(",")[0])} <span class="muted">(${x.bancada || "?"}, ${x.peso})</span>`).join("<br>")}</td>
        <td class="c num acta">${m.intermediacion.toFixed(2).replace(".", ",")}</td></tr>`; }).join("")}
  </tbody></table></div>
  <p class="muted small">Intermediación: qué tanto un congresista conecta a colegas que no firman directamente entre sí (de 0 a 1; más alto, más "puente").</p>`;
}
function seccionRedes() {
  if (!DATOS.redes) return "";
  const R = DATOS.redes.coautoria;
  return `<section class="sec" aria-labelledby="t-redes" id="redes">
    ${encabezado("Análisis de redes", "Con quién trabajan", `Red de coautoría: cada figura es un congresista que firmó al menos un proyecto junto a un cusqueño (${R.nodos.length} en total); cada línea, proyectos firmados juntos, más gruesa cuantos más sean. La forma y el color indican la bancada. Toca un cusqueño para ver solo sus vínculos.`, "t-redes")}
    ${leyendaBancadas()}
    <div class="red" id="red-coautoria">${redCoautoria()}</div>
    ${tablaSNA()}
    <h3 class="subtit">Afinidad de voto entre los diputados cusqueños</h3>
    <p class="muted">Porcentaje de votaciones del Pleno en que cada par votó igual (cuando ambos votaron). Línea más gruesa, más coincidencia.</p>
    <div class="afin">${afinidadCusquenos()}</div>
    <h3 class="subtit">¿Con qué bancada vota cada uno?</h3>
    <p class="muted">Porcentaje de votaciones en que su voto coincidió con el de la mayoría de cada bancada.</p>
    ${matrizBancadas()}
  </section>`;
}

function pie() {
  return `<footer><h2>De dónde salen los datos</h2><ol>
    <li>Proyectos de ley: sistema de proposiciones legislativas del Congreso. Autor principal es el primer firmante, que es quien firma el texto; el sistema a veces marca a todos los firmantes como autores.</li>
    <li>Asistencia y votaciones: actas de asistencia y votación del Pleno que publica cada cámara. Muchas son escaneos; las lecturas dudosas se verificaron a mano contra la imagen del acta.</li>
    <li>Intervenciones: Diario de Debates, la transcripción oficial de cada sesión del Pleno. Se cuenta cada vez que el congresista toma la palabra como orador; los turnos presidiendo la sesión se cuentan aparte. Los resúmenes salen de leer la transcripción completa.</li>
    <li>Comparaciones: los promedios salen de la tabla de totales por bancada que trae cada acta. Solo se usan las actas cuya tabla cuadra al sumarla (la suma de las bancadas debe dar el total de la cámara); las demás se descartan. "Votó igual que su bancada" compara su voto con la posición de la mayoría de su bancada; no se cuentan las votaciones en que la bancada empató.</li>
    <li>Temas y provincias: se asignan con listas de palabras clave sobre el texto oficial (título, resumen y texto completo de cada proyecto; transcripción de cada intervención). Pueden tener errores puntuales; las reglas están publicadas en el código del proyecto.</li>
    <li>Redes: la red de coautoría une a cada cusqueño con los congresistas que firmaron sus mismos proyectos (como autores o coautores). La bancada de cada congresista sale de las actas de asistencia. La afinidad de voto compara votaciones en que ambos votaron (a favor, en contra o abstención).</li>
    <li>Cada pase de lista y cada votación cuenta por separado. Solo incluye el Pleno, no las comisiones.</li>
    <li>Las cifras empiezan en julio de 2026. Con pocas sesiones, una sola ausencia mueve bastante los porcentajes.</li>
    <li>Si un dato está mal, el enlace "acta" o el número de proyecto lleva al documento original para comprobarlo.</li></ol>
    <p class="firma">${iconoMarca()}<span>Un proyecto de <a href="https://www.instagram.com/sieteborreguitos" target="_blank" rel="noopener">@sieteborreguitos</a></span></p></footer>`;
}

function filtrar(grupo, selector, prueba) {
  document.querySelectorAll(grupo + " button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(grupo + " button").forEach(x => x.setAttribute("aria-pressed", x === b));
    document.querySelectorAll(selector + " tr").forEach(tr => { tr.hidden = !prueba(b.dataset, tr); });
  }));
}

function mostrar(id = location.hash.slice(1)) {
  const c = DATOS.congresistas.find(x => x.slug === id);
  document.getElementById("app").innerHTML = c ? ficha(c) : inicio();
  if (c) filtrar(".filtros", "#votos", (d, tr) => {
    const v = tr.querySelector(".voto").textContent;
    return d.v === "todas" || (d.v === "NO" && v === "NO") || (d.v === "ABST" && v === "Abst.") || (d.v === "sin" && !["SI", "NO", "Abst.", "Presidía"].includes(v));
  });
  else filtrar(".filtros", "#acta", (d, tr) => d.f === "todas" || tr.classList.contains("split"));
  window.scrollTo(0, 0);
}

// Interacción de temas, mapa, agenda y buscador (delegada: sobrevive al redibujado de la página)
let temporizador = null, tipoBusqueda = "";
document.addEventListener("submit", ev => {
  if (ev.target.id !== "form-q") return;
  ev.preventDefault(); clearTimeout(temporizador);
  buscar(document.getElementById("q").value, tipoBusqueda);
});
document.addEventListener("input", ev => {
  if (ev.target.id !== "q") return;
  clearTimeout(temporizador); tipoBusqueda = "";
  temporizador = setTimeout(() => buscar(ev.target.value, tipoBusqueda), 250);
});
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  const fichaId = (DATOS.congresistas.find(x => x.slug === location.hash.slice(1)) || {}).id;
  if (b.dataset.temaSel) {
    document.querySelectorAll("[data-tema-sel]").forEach(x => x.setAttribute("aria-pressed", x === b));
    document.getElementById("tema-detalle").innerHTML = detalleTema(b.dataset.temaSel);
  } else if (b.dataset.temaFicha) {
    document.getElementById("tema-ficha").innerHTML = `<h3 class="subtit">${esc(nomTema(b.dataset.temaFicha))}</h3>` + detalleTema(b.dataset.temaFicha, fichaId);
  } else if (b.dataset.tema && document.querySelector(`[data-tema-sel="${b.dataset.tema}"]`)) {
    const sel = document.querySelector(`[data-tema-sel="${b.dataset.tema}"]`); sel.click(); document.getElementById("temas").scrollIntoView({ behavior: "smooth" });
  } else if (b.dataset.mapaC !== undefined) {
    mapaFiltro = b.dataset.mapaC; redibujarMapa();
  } else if (b.dataset.ag) {
    document.querySelectorAll("[data-ag]").forEach(x => x.setAttribute("aria-pressed", x === b));
    document.querySelectorAll(".ag-item").forEach(x => x.hidden = b.dataset.ag === "cusco" && x.dataset.cus !== "1");
  } else if (b.dataset.mas) {
    buscar(document.getElementById("q").value, tipoBusqueda, true);
  } else if (b.dataset.qt !== undefined) {
    tipoBusqueda = b.dataset.qt; buscar(document.getElementById("q").value, tipoBusqueda);
  } else if (b.dataset.prov) {
    mapaSel = mapaSel === b.dataset.prov ? null : b.dataset.prov; redibujarMapa();
  }
});
document.addEventListener("click", ev => {
  const n = ev.target.closest("#red-coautoria .nodo"); const red = document.getElementById("red-coautoria");
  if (!red) return;
  if (!n || !n.classList.contains("cus") || red.dataset.foco === n.dataset.n) { red.classList.remove("foco"); red.dataset.foco = ""; red.querySelectorAll(".on").forEach(x => x.classList.remove("on")); return; }
  const id = n.dataset.n; red.dataset.foco = id; red.classList.add("foco");
  red.querySelectorAll(".on").forEach(x => x.classList.remove("on"));
  const vec = new Set([id]);
  red.querySelectorAll(".arista").forEach(a => { if (a.dataset.a === id || a.dataset.b === id) { a.classList.add("on"); vec.add(a.dataset.a); vec.add(a.dataset.b); } });
  red.querySelectorAll(".nodo, text").forEach(x => { if (vec.has(x.dataset.n)) x.classList.add("on"); });
});
document.addEventListener("click", ev => {
  const p = ev.target.closest("path.prov"); if (!p) return;
  mapaSel = mapaSel === p.dataset.prov ? null : p.dataset.prov; redibujarMapa();
});
function redibujarMapa() {
  const sec = document.getElementById("mapa"); if (!sec) return;
  const fichaId = (DATOS.congresistas.find(x => x.slug === location.hash.slice(1)) || {}).id;
  sec.outerHTML = seccionMapa(fichaId);
}

// Tooltip compartido para cuadros del tejido, barras y pases de lista.
const tip = document.getElementById("tip");
document.addEventListener("pointermove", ev => {
  const t = ev.target.closest && ev.target.closest("[data-tip]");
  if (!t) { tip.hidden = true; return; }
  tip.innerHTML = t.getAttribute("data-tip");
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(ev.clientX + 14, innerWidth - w - 8) + "px";
  tip.style.top = (ev.clientY + 16 + h > innerHeight ? ev.clientY - h - 12 : ev.clientY + 16) + "px";
});
// Los enlaces internos (#holguin) se resuelven en la página; algunos visores no propagan el cambio de ancla.
document.addEventListener("click", ev => {
  const a = ev.target.closest('a[href^="#"]');
  if (!a) return;
  ev.preventDefault();
  const id = a.getAttribute("href").slice(1);
  try { history.pushState(null, "", "#" + id); } catch (e) { /* algunos visores no lo permiten */ }
  mostrar(id);
});
window.addEventListener("popstate", () => mostrar());
mostrar();
</script>
