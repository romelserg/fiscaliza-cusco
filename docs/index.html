    ${encabezado("Diario de Debates", "Lo que dijo en el Pleno", "Resumen de cada intervención, con una cita textual y el enlace a la página de la transcripción oficial. Debajo, cómo votó ese mismo día.", "t-dijo")}
    ${(() => { const mias = DATOS.intervenciones.filter(i => i.congresista === c.id).reverse();
      return mias.length ? plegar(mias.map(i => intervencion(i, false, true))) : `<p class="muted">No figura con intervenciones como orador en las transcripciones publicadas.</p>`; })()}
  </section>

  <section class="sec" aria-labelledby="t-propios">
    ${encabezado("Autor principal", "Proyectos que presentó", "Proyectos en los que es el primer firmante. El resumen sale de leer el texto completo.", "t-propios")}
    ${propios.length ? plegar(propios.map(p => proyecto(p, false)))
      : `<p class="muted">${c.camara === "S" ? "En el Congreso bicameral los proyectos de ley se presentan casi siempre en la Cámara de Diputados; el Senado los revisa. Por eso la labor del senador se ve sobre todo en sus votaciones." : "Todavía no presentó proyectos como autor principal."}</p>`}
    ${coaut.length ? `<details><summary>Ver los ${coaut.length} proyectos que firmó como coautor</summary><div class="lista">${coaut.map(p => `
      <div class="item"><div class="exp"><a href="${esc(p.pdf)}" target="_blank" rel="noopener">${esc(p.numero.split("-")[0])}</a><br>${fecha(p.fecha)}</div>
      <div class="txt"><span class="small">${esc(capital(p.titulo.replace(/^PROPOSICI[ÓO]N (DE RESOLUCI[ÓO]N )?LEGISLATIVA (DEL CONGRESO )?(QUE )?/, "")))}</span>
      <span class="nota">Autor: ${esc(p.autor.split(",")[0])} · ${esc(capital(p.estado))}</span></div></div>`).join("")}</div></details>` : ""}
  </section>
  ${seccionRecorrido(c.id)}

  <section class="sec" aria-labelledby="t-votos">
    ${encabezado("Pleno", "Cada votación", `Del acta oficial. "Por constancia" indica que el sistema no registró su voto o asistencia y la presidencia lo dejó constando en el acta.`, "t-votos")}
    <div class="filtros" role="group" aria-label="Filtrar sus votos">
      ${[["todas", "Todas"], ["NO", "En contra"], ["ABST", "Abstenciones"], ["sin", "No votó"]].map(([f, t], i) =>
        `<button type="button" id="v-${f}" data-v="${f}" aria-pressed="${i === 0}">${t}</button>`).join("")}</div>
    <div class="scroll"><table class="votos-t"><thead><tr><th>Fecha</th><th>Asunto</th><th class="c">Voto</th><th class="c">Fuente</th></tr></thead>
      <tbody id="votos">${vots.map(e => filaVoto(e, [c.id], false)).join("")}</tbody></table></div>
  </section>
  ${seccionEscribele(c.id)}
  <a class="volver volver-fin" href="#inicio">← Volver a la portada</a>
  ${tocapu()}
  ${pie()}`;
}

function proyecto(p, conAutor) {
  const r = p.resumen, paso = p.ultimo;
  const autor = conAutor ? DATOS.congresistas.find(c => p.cusco[c.id] === "Autor principal") : null;
  return `<article class="item">
    <div class="exp"><a href="${esc(p.pdf)}" target="_blank" rel="noopener">${esc(p.numero.replace("-2026-2031-CD", ""))}</a><br>${fecha(p.fecha)}<br>${esc(capital(p.estado))}
      ${r ? `<br><span class="pill">${r.cusco === "nacional" ? "Nacional" : r.cusco === "directa" ? "Cusco: directa" : "Cusco: indirecta"}</span>` : ""}</div>
    <div class="txt">
      <h3>${esc(r ? r.tema : capital(p.titulo))}${autor ? ` <span class="muted small">· ${esc(autor.corto)}</span>` : ""}</h3>
      ${r ? `<p>${esc(r.resumen)}</p>` : `<p class="nota">Resumen pendiente. Título oficial: ${esc(capital(p.titulo))}</p>`}
      ${r && r.por_que_cusco ? `<p class="nota"><b>Por qué importa en Cusco:</b> ${esc(r.por_que_cusco)}</p>` : ""}
      ${r && r.nota ? `<p class="nota"><b>Nota:</b> ${esc(r.nota)}</p>` : ""}
      ${tagsTema(p.temas)}
      ${paso && paso.comisiones ? `<p class="nota">Último paso (${fecha(paso.fecha)}): en ${esc(paso.comisiones)}</p>` : ""}
    </div></article>`;
}

function intervencion(i, conNombre, conVotos) {
  const c = DATOS.congresistas.find(x => x.id === i.congresista);
  const votos = conVotos ? DATOS.eventos.filter(e => e.camara === i.camara && e.fecha === i.fecha && e.tipo === "VOTACIÓN") : [];
  return `<article class="item">
    <div class="exp">${fecha(i.fecha)}<br><a href="${esc(i.fuente)}" target="_blank" rel="noopener">Diario de Debates, p. ${i.pagina}</a><br>${i.palabras} palabras
      ${i.cusco ? `<br><span class="pill">Menciona Cusco</span>` : ""}</div>
    <div class="txt">
      <h3>${esc(i.tema || "Intervención")}${conNombre ? ` <span class="muted small">· ${esc(c.corto)}</span>` : ""}</h3>
      ${i.resumen ? `<p>${esc(i.resumen)}</p>` : `<p class="nota">Resumen pendiente.</p>`}
      ${tagsTema(i.temas)}
      ${i.cita && !i.procedimiento ? `<blockquote class="cita">${esc(i.cita)}</blockquote>` : ""}
      ${votos.length ? `<div class="ese-dia"><span>Ese día votó:</span>${votos.map(e => { const v = e.votos[i.congresista];
        return `<span class="chip-voto" style="--c:${COLOR[v] || "var(--vacio)"}" data-tip="<b>${esc(LARGO[v] || v)}</b> · ${esc(e.hora || "")}<br>${esc(esc(capital(e.asunto).slice(0, 150)))}…">${esc(ETQ[v] || v)}</span>`; }).join("")}</div>` : ""}
    </div></article>`;
}

function quienHabla() {
  const filas = DATOS.congresistas.map(c => {
    const prop = DATOS.intervenciones.filter(i => i.congresista === c.id && !i.procedimiento);
    return { c, n: prop.length, pal: prop.reduce((a, i) => a + i.palabras, 0), pres: DATOS.presidio[c.id] || 0 };
  });
  const max = Math.max(...filas.map(f => f.pal), 1);
  return `<div class="hbars" role="img" aria-label="Palabras pronunciadas en el Pleno por cada congresista">${filas.map(f => `
    <div class="hbar"><a class="n" href="#${f.c.slug}">${esc(f.c.corto)}</a>
      <div class="track" style="width:${Math.max(100 * f.pal / max, 0.6)}%"><i style="flex:1;background:var(--ink);border-radius:0 4px 4px 0"
        data-tip="<b>${f.n}</b> ${f.n === 1 ? "intervención" : "intervenciones"} · ${f.pal.toLocaleString("es-PE")} palabras${f.pres ? `<br>Además, ${f.pres} turnos presidiendo la sesión` : ""}"></i></div>
      <span class="v">${f.n}</span></div>`).join("")}</div>
  <p class="muted small">Largo de la barra: palabras pronunciadas. Número: intervenciones como orador (sin contar avisos de procedimiento${filas.some(f => f.pres) ? " ni los turnos presidiendo la sesión" : ""}).</p>`;
}

const MARCAS = {
  yo: (x, y) => `<circle cx="${x}" cy="${y}" r="6" style="fill:var(--no);stroke:var(--paper);stroke-width:2"/>`,
  camara: (x, y) => `<circle cx="${x}" cy="${y}" r="5" style="fill:var(--paper);stroke:var(--ink);stroke-width:2"/>`,
  bancada: (x, y) => `<rect x="${x - 5}" y="${y - 5}" width="10" height="10" transform="rotate(45 ${x} ${y})" style="fill:var(--abst);stroke:var(--paper);stroke-width:1.5"/>`,
};
const pct1 = v => v == null ? "—" : `${String(Math.round(v * 10) / 10).replace(".", ",")}%`;

function puntos(valores, ancho = 400, alto = 30, ejes = true) {
  // valores: [{tipo, v, tip}] en 0–100
  const X = v => 8 + v / 100 * (ancho - 16), y = alto / 2;
  let s = `<svg viewBox="0 0 ${ancho} ${alto}" preserveAspectRatio="none" role="img">`;
  s += `<line x1="${X(0)}" x2="${X(100)}" y1="${y}" y2="${y}" style="stroke:var(--rule);stroke-width:1"/>`;
  if (ejes) [0, 50, 100].forEach(t => s += `<line x1="${X(t)}" x2="${X(t)}" y1="${y - 4}" y2="${y + 4}" style="stroke:var(--rule)"/>`);
  ["camara", "bancada", "yo"].forEach(tipo => valores.filter(v => v.tipo === tipo && v.v != null).forEach(v =>
    s += `<g data-tip="${v.tip}">${MARCAS[tipo](X(v.v), y)}</g>`));
  return s + "</svg>";
}

function leyendaContexto(c) {
  return `<div class="leyenda-comp">
    <span><svg viewBox="0 0 12 12">${MARCAS.yo(6, 6)}</svg>${c ? esc(c.corto) : "El congresista"}</span>
    <span><svg viewBox="0 0 12 12">${MARCAS.camara(6, 6)}</svg>Promedio de su cámara</span>
    <span><svg viewBox="0 0 12 12">${MARCAS.bancada(6, 6)}</svg>Promedio de su bancada</span></div>`;
}

function contexto(c) {
  const X = DATOS.contexto; if (!X) return "";
  const k = X.congresistas[c.id], cam = X.camaras[c.camara], ban = X.bancadas[`${c.camara}-${k.bancada}`];
  const nomCam = c.camara === "S" ? "el Senado" : "la Cámara de Diputados";
  const fila = (titulo, yo, camV, banV, detalle) => `<div class="comp-fila"><span class="t">${titulo}</span>
    ${puntos([{ tipo: "camara", v: camV, tip: `<b>${pct1(camV)}</b> promedio de ${nomCam}` }, { tipo: "bancada", v: banV, tip: `<b>${pct1(banV)}</b> promedio de su bancada` },
      { tipo: "yo", v: yo, tip: `<b>${pct1(yo)}</b> ${esc(c.corto)}` }])}<span class="d">${detalle}</span></div>`;
  const distintos = k.distinto.map(d => ({ d, e: DATOS.eventos.find(e => e.camara === c.camara && e.fecha === d.fecha && e.hora === d.hora && e.tipo === "VOTACIÓN") }));
  const maxPal = Math.max(k.palabras, k.promedio_palabras) * 1.6 || 1;
  return `
  <section class="sec" aria-labelledby="t-ctx">
    ${encabezado("Comparación", "En contexto", `Sus cifras frente al promedio de ${nomCam} y de su bancada, en las mismas sesiones. Se usan solo las actas cuya tabla de totales cuadra al sumarla (${cam.pases} pases de lista y ${cam.votaciones} votaciones de ${nomCam}).`, "t-ctx")}
    ${leyendaContexto(c)}
    <div class="comp">
      ${fila("Asistencia", k.asistencia, cam.asistencia, ban.asistencia, `${esc(c.corto)}: ${pct1(k.asistencia)} · cámara ${pct1(cam.asistencia)} · bancada ${pct1(ban.asistencia)}`)}
      ${fila("Votó cuando le tocaba", k.participacion, cam.participacion, null, `${k.participo} de ${k.votaciones} votaciones · cámara ${pct1(cam.participacion)}`)}
      ${fila("Votó igual que su bancada", k.con_su_bancada, cam.con_su_bancada, ban.con_su_bancada, `${pct1(k.con_su_bancada)} de ${k.comparables} votaciones · su bancada en promedio ${pct1(ban.con_su_bancada)} · cámara ${pct1(cam.con_su_bancada)}`)}
      <div class="comp-fila"><span class="t">Palabras en el Pleno</span>
        <svg viewBox="0 0 400 30" preserveAspectRatio="none" role="img"><line x1="8" x2="392" y1="15" y2="15" style="stroke:var(--rule)"/>
          <g data-tip="<b>${k.promedio_palabras.toLocaleString("es-PE")}</b> palabras: promedio por congresista">${MARCAS.camara(8 + k.promedio_palabras / maxPal * 384, 15)}</g>
          <g data-tip="<b>${k.palabras.toLocaleString("es-PE")}</b> palabras de ${esc(c.corto)}">${MARCAS.yo(8 + k.palabras / maxPal * 384, 15)}</g></svg>
        <span class="d">${k.palabras.toLocaleString("es-PE")} palabras · puesto ${k.puesto_palabras || k.miembros} de ${k.miembros} · promedio ${k.promedio_palabras.toLocaleString("es-PE")}</span></div>
    </div>
    ${distintos.length ? `<div class="sec-head" style="border-top-width:1px"><span class="folio">Detalle</span><h2 style="font-size:1.3rem">Cuando votó distinto a su bancada (${distintos.length})</h2><p>Votaciones en que su voto no coincidió con el de la mayoría de su bancada.</p></div>
      <div class="scroll"><table class="votos-t"><thead><tr><th>Fecha</th><th>Asunto</th><th class="c">Su voto</th><th class="c">Mayoría de su bancada</th></tr></thead><tbody>
      ${distintos.map(({ d, e }) => `<tr><td class="when">${fecha(d.fecha)}<br>${esc(d.hora)}</td><td class="asunto">${e ? asunto(e.asunto) : ""}</td>
        <td class="c" data-b="Su voto"><span class="voto" style="--c:${COLOR[d.voto]}">${votoTxt(d.voto)}</span></td><td class="c" data-b="Su bancada"><span class="voto" style="--c:${COLOR[d.bancada]}">${votoTxt(d.bancada)}</span></td></tr>`).join("")}
      </tbody></table></div>` : `<p class="muted">En las votaciones comparables siempre votó igual que la mayoría de su bancada.</p>`}
  </section>`;
}

function tablaContexto() {
  const X = DATOS.contexto; if (!X) return "";
  return `<section class="sec" aria-labelledby="t-ctx-todos">
    ${encabezado("Comparación", "En contexto", "Cada cusqueño frente al promedio de su cámara y de su bancada, en las mismas sesiones. Solo se usan las actas cuya tabla de totales cuadra al sumarla.", "t-ctx-todos")}
    ${leyendaContexto(null)}
    <div class="scroll"><table class="tabla-ctx"><thead><tr><th>Congresista</th><th>Asistencia</th><th></th><th>Votó igual que su bancada</th><th></th><th class="c">Palabras: puesto</th></tr></thead><tbody>
    ${DATOS.congresistas.map(c => { const k = X.congresistas[c.id], cam = X.camaras[c.camara], ban = X.bancadas[`${c.camara}-${k.bancada}`];
      const m = (yo, cv, bv) => puntos([{ tipo: "camara", v: cv, tip: `<b>${pct1(cv)}</b> promedio de la cámara` }, { tipo: "bancada", v: bv, tip: `<b>${pct1(bv)}</b> promedio de su bancada` }, { tipo: "yo", v: yo, tip: `<b>${pct1(yo)}</b> ${esc(c.corto)}` }], 140, 18, false).replace("<svg", '<svg class="mini"');
      return `<tr><td><a href="#${c.slug}">${esc(c.corto)}</a><br><span class="muted small">${c.camara === "S" ? "Senado" : "Diputados"}</span></td>
        <td class="num">${pct1(k.asistencia)}</td><td>${m(k.asistencia, cam.asistencia, ban.asistencia)}</td>
        <td class="num">${pct1(k.con_su_bancada)}</td><td>${m(k.con_su_bancada, cam.con_su_bancada, ban.con_su_bancada)}</td>
        <td class="c num acta">${k.puesto_palabras || k.miembros} de ${k.miembros}</td></tr>`; }).join("")}
    </tbody></table></div></section>`;
}

/* ---------- Temas ---------- */
const nomTema = t => DATOS.temas[t] || t;
function tagsTema(lista) {
  return lista && lista.length ? `<span class="temas-tags">${lista.map(t => `<button type="button" class="tema-tag" data-tema="${t}">${esc(nomTema(t))}</button>`).join("")}</span>` : "";
}
function itemsDeTema(tema, cid) {
  const cus = DATOS.congresistas.map(c => c.id);
  const propios = DATOS.proyectos.filter(p => (p.temas || []).includes(tema) && Object.entries(p.cusco).some(([i, r]) => r === "Autor principal" && (!cid || i === cid)));
  const dichos = DATOS.intervenciones.filter(i => (i.temas || []).includes(tema) && !i.procedimiento && (!cid || i.congresista === cid));
  const vistos = new Set();
  const votos = DATOS.eventos.filter(e => e.tipo === "VOTACIÓN" && (e.temas || []).includes(tema) && (!cid || e.votos[cid]) && !vistos.has(e.camara + e.fecha + e.hora) && vistos.add(e.camara + e.fecha + e.hora));
  return { propios, dichos, votos };
}
function seccionTemas() {
  const cuenta = Object.keys(DATOS.temas).map(t => { const x = itemsDeTema(t); return [t, x.propios.length + x.dichos.length + x.votos.length]; })
    .filter(([, n]) => n).sort((a, b) => b[1] - a[1]);
  return `<section class="sec" aria-labelledby="t-temas" id="temas">
    ${encabezado("Por tema", "Seguridad, salud, educación…", "Elige un tema para ver qué propusieron, qué dijeron en el Pleno y cómo votaron los cusqueños.", "t-temas")}
    <div class="chips desliza" role="group" aria-label="Temas">${cuenta.map(([t, n], i) => `<button type="button" id="tema-${t}" data-tema-sel="${t}" aria-pressed="${i === 0}">${esc(nomTema(t))}<b>${n}</b></button>`).join("")}</div>
    <div id="tema-detalle">${detalleTema(cuenta[0] ? cuenta[0][0] : null)}</div>
  </section>`;
}
function detalleTema(tema, cid) {
  if (!tema) return "";
  const { propios, dichos, votos } = itemsDeTema(tema, cid);
  const dip = DATOS.congresistas;
  return `${propios.length ? `<h3 class="subtit">Proyectos de los cusqueños (${propios.length})</h3>${plegar(propios.map(p => proyecto(p, !cid)))}` : ""}
    ${dichos.length ? `<h3 class="subtit">Lo que dijeron en el Pleno (${dichos.length})</h3>${plegar(dichos.map(i => intervencion(i, !cid, false)))}` : ""}
    ${votos.length ? `<h3 class="subtit">Votaciones (${votos.length})</h3><div class="scroll"><table class="votos-t"><thead><tr><th>Fecha</th><th>Asunto</th><th class="c">Votos de Cusco</th><th class="c">Fuente</th></tr></thead><tbody>
      ${[...votos].reverse().map((e, k) => `<tr${k >= 5 ? ' class="fila-extra" hidden' : ""}><td class="when">${fecha(e.fecha)}<br>${esc(e.hora || "")}</td><td class="asunto">${asunto(e.asunto)}</td>
        <td class="quien"><div class="ese-dia">${dip.filter(c => c.camara === e.camara && (!cid || c.id === cid)).map(c => { const v = e.votos[c.id];
          return `<span class="chip-voto" style="--c:${COLOR[v] || "var(--vacio)"}" data-tip="<b>${esc(c.corto)}</b>: ${esc(LARGO[v] || v)}">${esc(apellido(c))} ${esc(ETQ[v] || v)}</span>`; }).join("")}</div></td>
        <td class="c"><a class="acta small" href="${esc(e.fuente)}" target="_blank" rel="noopener">acta</a></td></tr>`).join("")}</tbody></table></div>
      ${votos.length > 5 ? `<button type="button" class="ver-mas" data-filas-extra="1">Ver ${votos.length - 5} más</button>` : ""}` : ""}
    ${!propios.length && !dichos.length && !votos.length ? `<p class="muted">Sin registros en este tema.</p>` : ""}`;
}
function temasDe(c) {
  const cuenta = {};
  DATOS.proyectos.filter(p => p.cusco[c.id] === "Autor principal").forEach(p => (p.temas || []).forEach(t => cuenta[t] = (cuenta[t] || 0) + 1));
  DATOS.intervenciones.filter(i => i.congresista === c.id && !i.procedimiento).forEach(i => (i.temas || []).forEach(t => cuenta[t] = (cuenta[t] || 0) + 1));
  const filas = Object.entries(cuenta).sort((a, b) => b[1] - a[1]);
  if (!filas.length) return "";
  const max = filas[0][1];
  return `<section class="sec" aria-labelledby="t-sustemas">
    ${encabezado("Por tema", "En qué temas trabaja", "Proyectos que presentó e intervenciones en el Pleno, por tema. Toca un tema para ver el detalle.", "t-sustemas")}
    <div class="hbars">${filas.map(([t, n]) => `<div class="hbar"><button type="button" class="n tema-tag" style="background:none;padding:0;font:600 0.92rem var(--body);color:var(--ink);text-align:left" data-tema-ficha="${t}">${esc(nomTema(t))}</button>
      <div class="track" style="width:${100 * n / max}%"><i style="flex:1;background:var(--ink);border-radius:0 4px 4px 0" data-tip="<b>${n}</b> entre proyectos e intervenciones"></i></div><span class="v">${n}</span></div>`).join("")}</div>
    <div id="tema-ficha"></div>
  </section>`;
}

/* ---------- Mapa ---------- */
let mapaFiltro = "", mapaSel = null;
function contarProvincias(cid) {
  const cuenta = {};
  Object.keys(DATOS.mapa.provincias).forEach(p => cuenta[p] = []);
  DATOS.menciones.filter(m => !cid || m.congresista === cid).forEach(m => cuenta[m.prov].push(m));
  return cuenta;
}
const nomProv = p => p === "LA CONVENCION" ? "La Convención" : p.charAt(0) + p.slice(1).toLowerCase();
function dibujoMapa(cid) {
  const M = DATOS.mapa, cuenta = contarProvincias(cid);
  const max = Math.max(1, ...Object.values(cuenta).map(l => l.length));
  const color = n => n ? `color-mix(in oklab, var(--cs) ${Math.round(25 + 75 * n / max)}%, var(--paper-2))` : "var(--paper-2)";
  return `<svg viewBox="0 0 ${M.ancho} ${M.alto}" role="img" aria-label="Mapa de las provincias de Cusco según cuántas veces las mencionaron">
    ${Object.entries(M.provincias).map(([p, g]) => { const l = cuenta[p], quien = {};
      l.forEach(m => { const c = DATOS.congresistas.find(x => x.id === m.congresista); quien[c.corto] = (quien[c.corto] || 0) + 1; });
      return `<path class="prov ${mapaSel === p ? "sel" : ""}" d="${g.d}" style="fill:${color(l.length)}" data-prov="${p}"
        data-tip="<b>${nomProv(p)}</b> · ${l.length ? `${l.length} ${l.length === 1 ? "mención" : "menciones"}<br>${Object.entries(quien).map(([n, k]) => `${esc(n)}: ${k}`).join(" · ")}` : "sin menciones"}"/>`; }).join("")}
    ${Object.entries(M.provincias).map(([p, g]) => `<text x="${p === "ACOMAYO" ? g.x + 18 : g.x}" y="${p === "ACOMAYO" ? g.y + 14 : g.y}" text-anchor="middle">${nomProv(p)}</text>`).join("")}

function rankingProv(cid) {

/* ---------- Buscador ----------
   Índice local (siempre disponible, viene dentro de la página) + Diario de Debates completo
   (busqueda.json, se descarga al primer uso). Si la descarga falla, se busca solo en el local. */
let INDICE = null, INDICE_COMPLETO = false, LIMITE = 10;
const norm = t => (t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
function indiceLocal() {
  const cus = new Set(DATOS.congresistas.map(c => c.id));
  const d = DATOS.proyectos.map(p => ({ t: "proyecto", f: p.fecha, q: p.autor, h: p.resumen ? p.resumen.tema : p.titulo.slice(0, 140),
    x: `${p.titulo} ${p.resumen ? p.resumen.resumen : ""}`, u: p.pdf, c: Object.keys(p.cusco) }));
  const vistos = new Set();
  DATOS.eventos.forEach(e => { const k = e.camara + e.fecha + e.hora;
    if (e.tipo === "VOTACIÓN" && !vistos.has(k)) { vistos.add(k);
      d.push({ t: "votación", f: e.fecha, q: e.camara === "S" ? "Senado" : "Cámara de Diputados", h: e.asunto.slice(0, 140), x: e.asunto, u: e.fuente, c: Object.keys(e.votos) }); } });
  DATOS.intervenciones.forEach(i => { const c = DATOS.congresistas.find(x => x.id === i.congresista);
    d.push({ t: "diario", f: i.fecha, q: c.corto, h: i.tema || "", x: `${i.tema || ""}. ${i.resumen || ""} ${i.cita || ""}`, u: i.fuente, c: [i.congresista] }); });
  return d.map(x => ({ ...x, n: norm(`${x.h} ${x.q} ${x.x}`) }));
}
function seccionBuscador() {
  return `<section class="buscador" aria-label="Buscador" id="buscar">
    <form class="barra-busqueda" id="form-q" role="search">
      <label for="q" class="etq">Buscar</label>
      <input type="search" id="q" placeholder="Machu Picchu, agua, Espinar…" autocomplete="off">
      <button type="submit">Buscar</button>
    </form>
    <p class="acta small muted" style="margin:0">En proyectos, votaciones y todo el Diario de Debates de ambas cámaras.</p>
    <div class="chips" role="group" aria-label="Tipo de documento" id="q-tipos"></div>
    <div id="q-res" class="res" aria-live="polite"></div>
  </section>`;
}
async function cargarIndice(caja) {
  if (!INDICE) INDICE = indiceLocal();
  if (INDICE_COMPLETO !== false) return;
  INDICE_COMPLETO = null;  // cargando
  try {
    const r = await fetch(new URL("busqueda.json", location.href));
    if (!r.ok) throw new Error(r.status);
    const extra = (await r.json()).filter(d => d.t === "diario").map(d => ({ ...d, n: norm(`${d.h} ${d.q} ${d.x}`) }));
    INDICE = INDICE.filter(d => d.t !== "diario").concat(extra);  // el Diario completo reemplaza a los resúmenes
    INDICE_COMPLETO = true;
  } catch (e) { INDICE_COMPLETO = "error"; }
}
async function buscar(q, tipo, mas) {
  const caja = document.getElementById("q-res"), tipos = document.getElementById("q-tipos");
  if (!caja) return;
  LIMITE = mas ? LIMITE + 20 : 10;
  const terms = norm(q).split(/\s+/).filter(w => w.length > 1);
  if (!terms.length) { caja.innerHTML = ""; tipos.innerHTML = ""; return; }
  if (!INDICE) INDICE = indiceLocal();
  if (INDICE_COMPLETO === false) { cargarIndice().then(() => { const v = document.getElementById("q"); if (v && v.value) buscar(v.value, tipoBusqueda); }); }
  // Palabras completas (con plural): "agua" encuentra "aguas" pero no "Aguayo". Desde 6 letras, también derivados.
  const escRe = t => t.replace(/[.*+?^$()|[\]\\{}]/g, "\\$&");
  const fin = t => t.length >= 6 ? "" : "(?:s|es)?(?![a-z0-9])";
  const pruebas = terms.map(t => new RegExp(`(?<![a-z0-9])${escRe(t)}${fin(t)}`));
  const hall = INDICE.filter(d => pruebas.every(r => r.test(d.n)));
  const NOM = { proyecto: "Proyectos", "votación": "Votaciones", diario: "Diario de Debates" };
  const porTipo = {}; hall.forEach(d => porTipo[d.t] = (porTipo[d.t] || 0) + 1);
  tipos.innerHTML = hall.length ? [["", "Todo", hall.length], ...Object.entries(porTipo).map(([t, n]) => [t, NOM[t], n])]
    .map(([t, nombre, n]) => `<button type="button" data-qt="${t}" aria-pressed="${(tipo || "") === t}">${nombre}<b>${n}</b></button>`).join("") : "";
  const todos = hall.filter(d => !tipo || d.t === tipo).sort((a, b) => (b.f || "").localeCompare(a.f || ""));
  const lista = todos.slice(0, LIMITE);
  const VOCAL = { a: "[aáàä]", e: "[eéèë]", i: "[iíìï]", o: "[oóòö]", u: "[uúùü]", n: "[nñ]" };
  const patron = t => [...t].map(ch => VOCAL[ch] || ch.replace(/[.*+?^$()|[\]\\{}]/g, "\\$&")).join("");
  const recorte = d => { const n = norm(d.x), m = n.search(pruebas[0]), i = Math.max(0, m - 110);
    let s = esc(d.x.slice(i, i + 300));
    terms.forEach(t => { s = s.replace(new RegExp(`(?<!\\p{L})(${patron(t)}${t.length >= 6 ? "" : "(?:s|es)?(?!\\p{L})"})`, "giu"), "<mark>$1</mark>"); });
    return (i ? "…" : "") + s + "…"; };
  const estado = INDICE_COMPLETO === true ? "" : INDICE_COMPLETO === "error"
    ? " · el Diario de Debates completo no se pudo cargar; se busca en proyectos, votaciones y resúmenes de las intervenciones de los cusqueños"
    : " · cargando el Diario de Debates completo…";
  caja.innerHTML = (hall.length ? `<p class="acta small muted">${hall.length} resultados${estado}</p>` + lista.map(d => `<div class="res-item">
      <div class="meta">${fecha(d.f)}<br>${NOM[d.t]}</div>
      <div><div class="q">${esc(d.t === "diario" ? d.q : d.h)}${d.c.length && d.t !== "votación" ? ` <span class="pill" style="margin:0 0 0 6px">Cusco</span>` : ""}</div>
      <p class="small">${recorte(d)}</p><a class="acta small" href="${esc(d.u)}" target="_blank" rel="noopener">Ver documento oficial</a></div></div>`).join("")
      + (todos.length > LIMITE ? `<button type="button" class="ver-mas" data-mas="1">Ver más resultados (${todos.length - LIMITE} restantes)</button>` : "")
    : `<p class="muted small">Sin resultados para «${esc(q)}»${estado}.</p>`);
}

/* ---------- Redes (SNA) ---------- */
const BANCADAS = { AN: "Ahora Nación", FP: "Fuerza Popular", JP: "Juntos por el Perú", PBG: "Partido del Buen Gobierno", PCO: "Partido Cívico Obras", RP: "Renovación Popular" };
const CODIGO_PARTIDO = Object.fromEntries(Object.entries(BANCADAS).map(([k, v]) => [v, k]));
const num1 = v => v == null ? "—" : String(Math.round(v * 10) / 10).replace(".", ",");
const nombreCus = id => { const c = DATOS.congresistas.find(x => x.id === id); return c ? apellido(c) : ""; };
const apellidoDe = nombre => { const a = String(nombre).split(",")[0].trim(); return a.split(" ").filter(w => w.length > 2 || /^[A-Z]{2}$/.test(w)).slice(0, 1).map(capital).join(" ") || capital(a); };
function forma(b, x, y, r, extra = "") {
  // Cada bancada con una forma distinta: el color no es el único código (lectura para daltonismo).
  const col = `fill:var(--b-${b || "x"}, var(--vacio))`;
  const pts = (n, rot) => Array.from({ length: n }, (_, i) => { const a = rot + i * 2 * Math.PI / n; return `${(x + r * Math.cos(a)).toFixed(1)},${(y + r * Math.sin(a)).toFixed(1)}`; }).join(" ");
  if (b === "FP") return `<rect x="${(x - r * 0.85).toFixed(1)}" y="${(y - r * 0.85).toFixed(1)}" width="${(r * 1.7).toFixed(1)}" height="${(r * 1.7).toFixed(1)}" style="${col}" ${extra}/>`;
  if (b === "JP") return `<polygon points="${pts(3, -Math.PI / 2)}" style="${col}" ${extra}/>`;
  if (b === "PBG") return `<polygon points="${pts(4, 0)}" style="${col}" ${extra}/>`;
  if (b === "PCO") return `<polygon points="${pts(6, 0)}" style="${col}" ${extra}/>`;
  if (b === "RP") return `<polygon points="${pts(5, -Math.PI / 2)}" style="${col}" ${extra}/>`;
  return `<circle cx="${x}" cy="${y}" r="${r}" style="${col}" ${extra}/>`;
}
function leyendaBancadas() {
  return `<div class="leyenda-banc">${Object.entries(BANCADAS).map(([b, n]) => `<span><svg viewBox="0 0 16 16">${forma(b, 8, 8, 6.5)}</svg>${n}</span>`).join("")}
    <span><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" style="fill:none;stroke:var(--ink);stroke-width:2.5"/></svg>Congresista de Cusco</span></div>`;
}

// Red de coautoría de toda una cámara. Las líneas de un solo proyecto se ocultan salvo al enfocar a alguien.
function redCamara(cam, id) {
  const R = DATOS.redes.coautoria[cam]; if (!R) return "";
  const pos = Object.fromEntries(R.nodos.map(n => [n.id, n]));
  const maxP = Math.max(...R.aristas.map(a => a.peso));
  const radio = n => n.cusco ? 10 : 2.6 + Math.sqrt(n.fuerza) * 0.42;
  const aristas = [...R.aristas].sort((a, b) => a.peso - b.peso).map(a => { const A = pos[a.a], B = pos[a.b];
    return `<line class="arista${a.peso < 2 ? " debil" : ""}" data-a="${a.a}" data-b="${a.b}" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" style="stroke-width:${(0.5 + 3 * Math.sqrt(a.peso / maxP)).toFixed(2)}"
      data-tip="<b>${esc(A.nombre)} y ${esc(B.nombre)}</b><br>${a.peso} ${a.peso === 1 ? "proyecto firmado" : "proyectos firmados"} juntos"/>`; }).join("");
  const nodos = [...R.nodos].sort((a, b) => a.cusco - b.cusco).map(n => forma(n.bancada, n.x, n.y, radio(n),
    `class="nodo ${n.cusco ? "cus" : ""}" data-n="${n.id}" data-tip="<b>${esc(n.completo)}</b><br>${esc(BANCADAS[n.bancada] || "Bancada no identificada")}<br>${n.grado} coautores distintos · ${n.propios} ${n.propios === 1 ? "proyecto propio" : "proyectos propios"}"`)).join("");
  const corto = id => { const c = DATOS.congresistas.find(x => x.id === id); return c ? apellido(c) : ""; };
  const etiquetas = R.nodos.filter(n => n.cusco).map(n => `<text x="${n.x}" y="${n.y - 16}" text-anchor="middle" data-n="${n.id}">${esc(corto(n.id))}</text>`).join("");
  return `<svg viewBox="0 0 ${R.ancho} ${R.alto}" role="img" aria-label="Red de coautoría de ${cam === "D" ? "la Cámara de Diputados" : "el Senado"}: ${R.nodos.length} congresistas y ${R.aristas.length} vínculos">
    ${(R.grupos || []).map(g => `<circle class="grupo" cx="${g.x}" cy="${g.y}" r="${g.r + 14}"/>
      <text class="grupo-nom" x="${g.x}" y="${g.y + g.r + 32}" text-anchor="middle">${esc(BANCADAS[g.bancada] || g.bancada)} · ${g.miembros}</text>`).join("")}
    <g class="aristas">${aristas}</g>${nodos}${etiquetas}</svg>`;
}

// Franja de distribución: cada punto gris es un diputado; las figuras, los cusqueños.
function franja(R, campo, titulo, nota, formato, invertir = false) {
  const vals = R.nodos.filter(n => n[campo] != null);
  if (!vals.length) return "";
  const W = 680, H = 92, x0 = 16, x1 = W - 16, y = 58;
  const max = Math.max(...vals.map(n => n[campo])), min = 0;
  const X = v => x0 + (v - min) / ((max - min) || 1) * (x1 - x0);
  const orden = [...vals].map(n => n[campo]).sort((a, b) => a - b);
  const mediana = orden.length % 2 ? orden[(orden.length - 1) / 2] : (orden[orden.length / 2 - 1] + orden[orden.length / 2]) / 2;
  // Puntos grises con desplazamiento vertical determinista para que no se tapen
  const cuenta = {};
  const grises = vals.filter(n => !n.cusco).map(n => { const k = Math.round(X(n[campo]) / 5); cuenta[k] = (cuenta[k] || 0) + 1;
    const dy = ((cuenta[k] - 1) % 5) * 4 - 8;
    return `<circle cx="${X(n[campo]).toFixed(1)}" cy="${y + dy}" r="2.6" class="gris" data-tip="<b>${esc(n.completo)}</b> · ${n.bancada || "?"}<br>${esc(titulo)}: ${formato(n[campo])}"/>`; }).join("");
  const cus = vals.filter(n => n.cusco).sort((a, b) => a[campo] - b[campo]);
  // Cusqueños con el mismo valor comparten una sola etiqueta
  const juntos = [];
  cus.forEach(n => { const g = juntos.find(j => Math.abs(X(j[0][campo]) - X(n[campo])) < 3); g ? g.push(n) : juntos.push([n]); });
  const filas = [];  // etiquetas en filas para que no se encimen
  const marcas = juntos.map(g => { const x = X(g[0][campo]); const nom = g.map(n => nombreCus(n.id) || apellidoDe(n.completo)).join(" · ");
    const ancho = 8 + nom.length * 7; let f = 0;
    while (filas[f] != null && x - ancho / 2 - filas[f] < 6) f++; filas[f] = x + ancho / 2;
    const ly = 30 - f * 13;
    const tx = Math.min(Math.max(x, x0 + ancho / 2), x1 - ancho / 2);
    return `<line x1="${x}" y1="${ly + 3}" x2="${x}" y2="${y - 9}" class="guia"/>
      ${g.map((n, k) => { const puesto = 1 + vals.filter(o => invertir ? o[campo] < n[campo] : o[campo] > n[campo]).length;
        return forma(n.bancada, x + (k - (g.length - 1) / 2) * 5, y, 7.5, `class="nodo cus" data-tip="<b>${esc(n.completo)}</b><br>${esc(titulo)}: ${formato(n[campo])}<br>Puesto ${puesto} de ${vals.length}"`); }).join("")}
      <text x="${tx}" y="${ly}" text-anchor="middle">${esc(nom)}</text>`; }).join("");
  const alto = H + 6;
  return `<figure class="franja"><figcaption><b>${titulo}</b> <span class="muted small">${nota}</span></figcaption>
    <svg viewBox="0 ${30 - 13 * Math.max(filas.length - 1, 0) - 14} ${W} ${alto + 13 * Math.max(filas.length - 1, 0)}" role="img" aria-label="${esc(titulo)}: distribución de ${vals.length} congresistas, con los cusqueños resaltados">
      <line x1="${x0}" x2="${x1}" y1="${y + 14}" y2="${y + 14}" class="eje"/>
      <line x1="${X(mediana)}" x2="${X(mediana)}" y1="${y - 14}" y2="${y + 18}" class="mediana"/>
      <text class="ref" x="${X(mediana) + 4}" y="${y + 28}">mediana ${formato(mediana)}</text>
      ${X(mediana) - x0 > 80 ? `<text class="ref" x="${x0}" y="${y + 28}">${formato(min)}</text>` : ""}${x1 - X(mediana) > 110 ? `<text class="ref" x="${x1}" y="${y + 28}" text-anchor="end">${formato(max)}</text>` : ""}
      ${grises}${marcas}</svg></figure>`;
}

function tablaCoautoria() {
  const R = DATOS.redes.coautoria;
  const filas = DATOS.congresistas.map(c => { const m = (R[c.camara] || {}).metricas?.[c.id]; if (!m) return "";
    const N = R[c.camara].nodos.length;
    return `<tr><td><a href="#${c.slug}">${esc(c.corto)}</a><br><span class="muted small">${c.camara === "S" ? "Senado" : "Diputados"}</span></td>

// ¿De qué lado se pone cada diputado cuando Fuerza Popular y Juntos por el Perú votan distinto?
function mapaVotacion(cam) {
  const L = DATOS.redes.votacion && DATOS.redes.votacion[cam] && DATOS.redes.votacion[cam].lados; if (!L || !L.puntos.length) return "";
  const W = 800, x0 = 215, x1 = W - 30, filaH = 64, top = 46;
  const X = v => x0 + v * (x1 - x0);
  const orden = Object.keys(BANCADAS).map(b => ({ b, pts: L.puntos.filter(p => p.bancada === b) })).filter(g => g.pts.length)
    .map(g => ({ ...g, media: g.pts.reduce((s, p) => s + p.x, 0) / g.pts.length })).sort((a, b) => a.media - b.media);
  const H = top + orden.length * filaH + 30;
  const paso = 8.5, maxFilas = 5;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="En las ${L.votaciones} votaciones que dividieron a ${BANCADAS[L.a]} y ${BANCADAS[L.b]}, de qué lado votó cada diputado">
    <text class="lado" x="${x0}" y="18">← Siempre con ${esc(BANCADAS[L.a])}</text>
    <text class="lado" x="${x1}" y="18" text-anchor="end">Siempre con ${esc(BANCADAS[L.b])} →</text>
    <line class="eje-v" x1="${X(0.5)}" x2="${X(0.5)}" y1="${top - 14}" y2="${H - 22}"/>
    <text class="ref" x="${X(0.5)}" y="${H - 6}" text-anchor="middle">mitad y mitad</text>`;
  const etiquetas = [];
  orden.forEach((g, k) => {
    const yc = top + k * filaH + filaH / 2;
    s += `<line class="riel" x1="${x0}" x2="${x1}" y1="${yc}" y2="${yc}"/>
      <text class="banc" x="${x0 - 14}" y="${yc + 4}" text-anchor="end">${esc(BANCADAS[g.b])}</text>`;
    // Los que votaron igual se apilan en una cuadrícula alrededor de su posición (sin salirse del eje)
    const grupos = {};
    g.pts.filter(p => !p.cusco).forEach(p => (grupos[p.x] = grupos[p.x] || []).push(p));
    Object.entries(grupos).forEach(([x, ps]) => {
      const filas = Math.min(ps.length, maxFilas), cols = Math.ceil(ps.length / maxFilas);
      let cx = X(+x) - (cols - 1) * paso / 2;
      cx = Math.min(Math.max(cx, x0), x1 - (cols - 1) * paso);
      ps.forEach((p, j) => {
        const c = Math.floor(j / filas), f = j % filas;
        s += forma(p.bancada, cx + c * paso, yc + (f - (filas - 1) / 2) * paso, 3.6,
          `class="nodo" data-tip="<b>${esc(p.nombre)}</b><br>Votó como ${esc(BANCADAS[L.b])} en ${p.como_b} y como ${esc(BANCADAS[L.a])} en ${p.como_a} de estas votaciones"`);
      });
    });
    g.pts.filter(p => p.cusco).forEach(p => {
      const c = DATOS.congresistas.find(x => String(x.id) === String(p.id));
      s += forma(p.bancada, X(p.x), yc, 11, `class="nodo cus" style="stroke:var(--ink);stroke-width:2.5" data-tip="<b>${esc(c ? c.corto : p.nombre)}</b><br>Votó como ${esc(BANCADAS[L.b])} en ${p.como_b} y como ${esc(BANCADAS[L.a])} en ${p.como_a} de estas votaciones"`);
      etiquetas.push({ x: X(p.x), y: yc - 18, t: `${c ? apellido(c) : p.nombre} · ${p.como_b} de ${p.como_a + p.como_b}` });
    });
  });
  etiquetas.forEach(e => { const ancho = e.t.length * 7.2; const tx = Math.min(Math.max(e.x, x0 + ancho / 2), x1 - ancho / 2);
    s += `<text class="cus-nom" x="${tx}" y="${e.y}" text-anchor="middle">${esc(e.t)}</text>`; });
  return s + "</svg>";
}

// Afinidad entre los cusqueños: cada uno ubicado según cuánto coincide con los demás (más coincidencia, más cerca).
function afinidadCusquenos() {
  const A = DATOS.redes.pares_cusquenos, P = DATOS.redes.afinidad_xy, dip = DATOS.congresistas.filter(c => c.camara === "D");
  if (!P) return "";
  const W = 640, H = 500, cx = W / 2, cy = H / 2;
  const p = dip.map(c => ({ c, x: cx + P[c.id][0] * 1.3, y: cy + P[c.id][1] * 1.15 }));
  const par = (a, b) => A[`${a}-${b}`] || A[`${b}-${a}`];
  const lazos = [];
  for (let i = 0; i < p.length; i++) for (let j = i + 1; j < p.length; j++) { const d = par(p[i].c.id, p[j].c.id); if (d && d.pct != null) lazos.push({ a: p[i], b: p[j], d }); }
  lazos.sort((u, v) => u.d.pct - v.d.pct);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diputados cusqueños ubicados según cuánto coinciden sus votos: más cerca, más coincidencia">`;
  lazos.forEach(({ a, b, d }) => {
    const fuerte = d.pct >= 90, medio = d.pct >= 80;
    s += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="lazo ${fuerte ? "fuerte" : medio ? "medio" : "debil"}"
      data-tip="<b>${esc(a.c.corto)} y ${esc(b.c.corto)}</b><br>Votaron igual en ${d.igual} de ${d.total} votaciones (${pct1(d.pct)})"/>`;
  });
  // Cifras: en el medio de cada línea; si la línea es corta, desplazadas hacia un costado
  const ocupados = p.map(q => ({ x: q.x, y: q.y }));
  lazos.forEach(({ a, b, d }) => {
    const fuerte = d.pct >= 90, largo = Math.hypot(b.x - a.x, b.y - a.y);
    let mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (largo < 110) { const nx = -(b.y - a.y) / largo, ny = (b.x - a.x) / largo; const sgn = (mx - cx) * nx + (my - cy) * ny >= 0 ? 1 : -1; mx += nx * 24 * sgn; my += ny * 24 * sgn; }
    // Si la cifra cae sobre otro diputado o sobre otra cifra, se corre a lo largo de su línea
    for (const t of [0.35, 0.65, 0.25, 0.75]) {
      if (!ocupados.some(o => Math.hypot(o.x - mx, o.y - my) < 30)) break;
      mx = a.x + (b.x - a.x) * t; my = a.y + (b.y - a.y) * t;
    }
    ocupados.push({ x: mx, y: my });
    s += `<text class="pct ${fuerte ? "fuerte" : ""}" x="${mx}" y="${my}" dy="5" text-anchor="middle">${Math.round(d.pct)}%</text>`;
  });
  p.forEach(q => { const b = CODIGO_PARTIDO[q.c.partido];
    s += forma(b, q.x, q.y, 17, `class="nodo cus" style="stroke:var(--ink);stroke-width:3" data-tip="<b>${esc(q.c.corto)}</b> · ${esc(q.c.partido)}"`); });
  // Nombres: en la dirección con más espacio libre (lejos de otros nodos, cifras y nombres)
  p.forEach(q => {
    let mejor = null;
    for (let k = 0; k < 8; k++) {
      const ang = k * Math.PI / 4, lx = q.x + Math.cos(ang) * 44, ly = q.y + Math.sin(ang) * 34;
      const libre = Math.min(...ocupados.filter(o => o.x !== q.x || o.y !== q.y).map(o => Math.hypot(o.x - lx, o.y - ly)), lx - 40, W - 40 - lx, ly - 20, H - 10 - ly);
      if (!mejor || libre > mejor.libre) mejor = { libre, lx, ly, ang };
    }
    ocupados.push({ x: mejor.lx, y: mejor.ly });
    const c = Math.cos(mejor.ang);
    s += `<text class="nom" x="${mejor.lx}" y="${mejor.ly + 6}" text-anchor="${c > 0.3 ? "start" : c < -0.3 ? "end" : "middle"}">${esc(apellido(q.c))}</text>`;
  });
  return s + "</svg>";
}

function hallazgos() {
  const D = DATOS.redes.coautoria.D, V = DATOS.redes.votacion && DATOS.redes.votacion.D;
  const cus = DATOS.congresistas.filter(c => c.camara === "D");
  const nom = id => (cus.find(c => c.id === id) || {}).corto || id;
  const top = Object.entries(D.metricas).sort((a, b) => b[1].intermediacion - a[1].intermediacion)[0];
  const solos = Object.entries(D.metricas).filter(([, m]) => !m.fuera_de_bancada).map(([id]) => nom(id));
  const l = [];
  l.push(`En Diputados casi nadie firma con otras bancadas: la mediana es ${pct1(D.mediana_fuera_camara ?? Object.values(D.metricas)[0].mediana_fuera_camara)} de las firmas. Los ${D.comunidades.length} grupos que encuentra el algoritmo coinciden con las ${D.comunidades.length} bancadas.`);
  if (top) l.push(`${esc(nom(top[0]))} es el cusqueño que más conecta grupos: puesto ${top[1].puesto_intermediacion} de ${D.nodos.length} en ${glosa("intermediación", "Qué tanto un congresista une a colegas que no firman entre sí. Alto: hace de puente entre grupos.")}, con ${pct1(top[1].fuera_de_bancada)} de sus firmas fuera de su bancada.`);
  if (solos.length) l.push(`${solos.map(esc).join(", ").replace(/, ([^,]*)$/, " y $1")} ${solos.length === 1 ? "solo firmó" : "solo firmaron"} con su propia bancada.`);
  return `<ul class="hallazgos">${l.map(x => `<li>${x}</li>`).join("")}</ul>`;
}

/* ---------- Padrón: proyectos, coautorías e intervenciones ---------- */
function padronBarras() {
  const R = DATOS.recorrido, ctx = (DATOS.contexto || {}).congresistas || {}, camCtx = (DATOS.contexto || {}).camaras || {};
  const filas = DATOS.congresistas.map(c => {
    const k = cifras(c), cam = (R && R.camaras[c.camara]) || {}, x = ctx[c.id] || {};
    return { c, k, b: CODIGO_PARTIDO[c.partido], asis: k.pases ? Math.round(1000 * k.presente / k.pases) / 10 : 0, medA: (camCtx[c.camara] || {}).asistencia,
      propios: k.autor, coautor: k.coautor, habla: k.habla, palabras: x.palabras, puesto: x.puesto_palabras, miembros: x.miembros,
      medP: cam.mediana_propios, medC: cam.mediana_coautor };
  });
  const cols = [
    { clave: "asis", med: "medA", titulo: "Asistencia", nota: "pases de lista", max: 100, pct: true },
    { clave: "propios", med: "medP", titulo: "Proyectos propios", nota: "como autor principal" },
    { clave: "coautor", med: "medC", titulo: "Como coautor", nota: "proyectos de otros" },
    { clave: "habla", med: null, titulo: "Intervenciones", nota: "como orador" },
  ];
  cols.forEach(col => { col.max = col.max || Math.max(1, ...filas.map(f => Math.max(f[col.clave] || 0, col.med ? f[col.med] || 0 : 0))); });
  const barra = (f, col) => {
    const v = f[col.clave] || 0, pct = 100 * v / col.max, med = col.med ? f[col.med] : null;
    const tip = col.clave === "asis"
      ? `<b>${esc(f.c.corto)}</b>: presente en ${f.k.presente} de ${f.k.pases} pases de lista (${pct1(v)})${med != null ? `<br>Promedio de ${f.c.camara === "S" ? "los senadores" : "los diputados"}: ${pct1(med)}` : ""}<br>Votó en ${f.k.participo} de ${f.k.votables} votaciones`
      : col.clave === "habla"
      ? `<b>${esc(f.c.corto)}</b>: ${v} ${v === 1 ? "intervención" : "intervenciones"}${f.palabras ? `<br>${f.palabras.toLocaleString("es-PE")} palabras · puesto ${f.puesto} de ${f.miembros} en su cámara` : ""}`
      : `<b>${esc(f.c.corto)}</b>: ${v} ${col.clave === "propios" ? (v === 1 ? "proyecto como autor principal" : "proyectos como autor principal") : (v === 1 ? "proyecto como coautor" : "proyectos como coautor")}${med != null ? `<br>Mediana de ${f.c.camara === "S" ? "los senadores" : "los diputados"}: ${String(med).replace(".", ",")}` : ""}`;
    return `<div class="pb-celda" data-tip="${tip}">
      <div class="pb-pista">${v ? `<i style="width:${pct.toFixed(1)}%;background:var(--b-${f.b}, var(--ink))"></i>` : ""}${med != null ? `<b class="pb-med" style="left:${(100 * med / col.max).toFixed(1)}%"></b>` : ""}</div>
      <span class="pb-v${col.pct && v < (med || 0) ? " bajo" : ""}">${col.pct ? Math.round(v) + "<small>%</small>" : v}</span>
      ${col.clave === "asis" ? `<span class="pb-sub">${f.k.presente} de ${f.k.pases} · votó en ${f.k.participo} de ${f.k.votables} votaciones</span>` : ""}
      ${col.clave === "habla" && f.palabras ? `<span class="pb-sub">${f.palabras.toLocaleString("es-PE")} palabras · puesto ${f.puesto} de ${f.miembros}</span>` : ""}
    </div>`;
  };
  // En el celular: una pestaña por indicador, con los seis en un mismo gráfico
  const movil = `<div class="pbm"><div class="chips desliza" role="group" aria-label="Elegir indicador">${cols.map((col, k) =>
      `<button type="button" data-pbm="${k}" aria-pressed="${k === 0}">${col.titulo}</button>`).join("")}</div>
    ${cols.map((col, k) => `<div class="pbm-panel" data-panel="${k}"${k ? " hidden" : ""}><p class="pbm-nota">${col.titulo}: ${col.nota}${col.med ? ". La marca vertical es " + (col.clave === "asis" ? "el promedio" : "la mediana") + " de su cámara" : ""}.</p>
      ${filas.map(f => `<a class="pbm-fila" href="#${f.c.slug}"><span><span class="pbm-nom">${esc(apellido(f.c))}</span><span class="pb-sub"><svg class="pb-forma" viewBox="0 0 16 16" aria-hidden="true">${forma(f.b, 8, 8, 6.5)}</svg>${f.c.camara === "S" ? "Senado" : esc(f.b)}</span></span>${barra(f, col)}</a>`).join("")}</div>`).join("")}</div>`;
  return `${movil}<div class="pb" role="table" aria-label="Proyectos propios, coautorías e intervenciones de cada congresista">
    <div class="pb-fila pb-cab" role="row"><span role="columnheader"></span>${cols.map(col => `<span role="columnheader"><b>${col.titulo}</b><br><span class="muted">${col.nota}</span></span>`).join("")}</div>
    ${filas.map(f => `<a class="pb-fila" role="row" href="#${f.c.slug}">
      <span role="cell"><span class="pb-nom">${esc(f.c.corto)}</span><span class="pb-sub"><svg class="pb-forma" viewBox="0 0 16 16" aria-hidden="true">${forma(f.b, 8, 8, 6.5)}</svg>${esc(f.c.partido)} · ${f.c.camara === "S" ? "Senado" : "Diputados"}</span></span>
      ${cols.map(col => `<span role="cell">${barra(f, col)}</span>`).join("")}</a>`).join("")}
  </div>
  <p class="muted small">Cada barra lleva el color de la bancada del congresista. Marca vertical: en asistencia, el promedio de su cámara (${pct1(camCtx.D && camCtx.D.asistencia)} en Diputados, ${pct1(camCtx.S && camCtx.S.asistencia)} en el Senado); en proyectos, la mediana de su cámara (${R ? `${String(R.camaras.D.mediana_propios).replace(".", ",")} proyectos propios y ${String(R.camaras.D.mediana_coautor).replace(".", ",")} como coautor entre los diputados; ${String(R.camaras.S.mediana_propios).replace(".", ",")} y ${String(R.camaras.S.mediana_coautor).replace(".", ",")} entre los senadores, porque casi todos los proyectos entran por Diputados` : ""}). Las intervenciones no cuentan los turnos presidiendo la sesión.</p>`;
}

/* ---------- Recorrido de los proyectos ---------- */
// Etapas en una sola tinta, de clara a oscura según cuánto avanzó; archivados en contorno punteado.
const COLOR_ETAPA = [0, 1, 2, 3, 4].map(k => `color-mix(in oklab, var(--ink) ${[22, 42, 64, 84, 100][k]}%, var(--paper))`);
function cuadroEtapa(p, c) {
  const archivado = p.etapa === 5;
  return `<i class="pz${archivado ? " arch" : ""}" style="${archivado ? "" : `background:${COLOR_ETAPA[p.etapa]}`}"
    data-tip="<b>${esc(p.numero)}</b> · ${esc(DATOS.recorrido.etapas[p.etapa])}<br>${esc(capital(p.titulo).slice(0, 150))}${p.titulo.length > 150 ? "…" : ""}<br>Estado: ${esc(capital(p.estado))}${p.etapa < 2 ? ` · ${p.dias} días desde que se presentó` : ""}"></i>`;
}
function leyendaEtapas() {
  return `<div class="legend">${DATOS.recorrido.etapas.map((e, k) => `<span><i style="${k === 5 ? "background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-2)" : `--c:${COLOR_ETAPA[k]}`}"></i>${esc(e)}</span>`).join("")}</div>`;
}
function barraCamara(r) {
  return `<div class="rc-barra">${r.por_etapa.map((n, k) => n ? `<i style="flex:${n};${k === 5 ? "background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-2)" : `background:${COLOR_ETAPA[k]}`}"
    data-tip="<b>${n}</b> de ${r.total} proyectos (${pct1(100 * n / r.total)}): ${esc(DATOS.recorrido.etapas[k])}"></i>` : "").join("")}</div>`;
}
function filaRecorrido(c) {
  const r = DATOS.recorrido.congresistas[c.id];
  const co = r.coautor;
  return `<div class="rc-fila"><div><a href="#${c.slug}" class="rc-nom">${esc(c.corto)}</a><div class="sub">${r.total} ${r.total === 1 ? "proyecto propio" : "proyectos propios"}${r.dictamen_o_mas ? ` · <b>${r.dictamen_o_mas}</b> con dictamen o más` : ""}</div></div>
    <div class="rc-pz">${r.total ? r.proyectos.map(p => cuadroEtapa(p, c)).join("") : `<span class="muted small">No es autor principal de ningún proyecto.</span>`}</div>
    <div class="small muted rc-co">Como coautor: ${co.total}${co.dictamen_o_mas ? `, ${co.dictamen_o_mas} con dictamen o más` : ""}</div></div>`;
}
function seccionRecorrido(soloId) {
  const R = DATOS.recorrido; if (!R) return "";
  const D = R.camaras.D, S = R.camaras.S;
  const lista = DATOS.congresistas.filter(c => !soloId || soloId === "cuerpo" || c.id === soloId);
  const camaras = soloId && soloId !== "cuerpo" ? [lista[0].camara] : ["D", "S"];
  const filas = camaras.map(cam => { const r = R.camaras[cam]; return `
    <div class="rc-fila rc-camara"><div><span class="rc-nom">${cam === "D" ? "Toda la Cámara de Diputados" : "Todo el Senado"}</span><div class="sub">${r.total} proyectos de ${cam === "D" ? "diputados" : "senadores"}</div></div>
      ${barraCamara(r)}<div class="small muted rc-co">${pct1(100 * r.dictamen_o_mas / (r.total || 1))} con dictamen o más${r.dias_esperando_mediana != null ? ` · los que esperan llevan ${r.dias_esperando_mediana} días (mediana)` : ""}</div></div>
    ${lista.filter(c => c.camara === cam).map(filaRecorrido).join("")}`; }).join("");
  const leyes = D.por_etapa[4] + S.por_etapa[4];
  if (soloId === "cuerpo") return { filas, leyes };
  return `<section class="sec" aria-labelledby="t-recorrido${soloId ? "-f" : ""}">
    ${encabezado("Proyectos de ley", "¿Hasta dónde llegan?", `Cada cuadro es un proyecto en el que ${soloId ? "es" : "cada uno es"} autor principal, según la etapa a la que llegó. Arriba, como referencia, todos los proyectos de ${soloId ? "su cámara" : "cada cámara"}: en lo que va del período, ${pct1(100 * D.dictamen_o_mas / (D.total || 1))} de los proyectos de diputados tiene dictamen o más${leyes ? ` y ${leyes} ya son ley` : " y ninguno es ley todavía"}. Toca un cuadro (o pasa el cursor) para ver el proyecto.`, "t-recorrido" + (soloId ? "-f" : ""))}
    ${leyendaEtapas()}
    <div class="recorrido">${filas}</div>
  </section>`;
}

function recorridoCuerpo() {
  const R = DATOS.recorrido; if (!R) return "";
  const { filas } = seccionRecorrido("cuerpo");
  return `<h3 class="subtit">¿Hasta dónde llegan?</h3>
    <p class="muted">Cada cuadro es un proyecto propio, según la etapa a la que llegó; arriba, como referencia, todos los de su cámara. Toca un cuadro (o pasa el cursor) para ver cuál es.</p>
    ${leyendaEtapas()}<div class="recorrido">${filas}</div>`;
}

/* ---------- Escríbele a tu congresista ---------- */
const PROVINCIAS_CUSCO = ["Acomayo", "Anta", "Calca", "Canas", "Canchis", "Chumbivilcas", "Cusco", "Espinar", "La Convención", "Paruro", "Paucartambo", "Quispicanchi", "Urubamba"];
const numCorto = n => String(+n.split("-")[0]);
const tituloCorto = t => capital(t.replace(/^PROPOSICI[ÓO]N (DE RESOLUCI[ÓO]N )?(LEGISLATIVA|DE LEY) (DEL CONGRESO )?(QUE )?/i, "")).replace(/[.\s]+$/, "");
const MOTIVOS = { proyecto: "Pregunta sobre uno de sus proyectos", voto: "Pregunta sobre un voto suyo", pedido: "Un pedido para mi provincia", otro: "Otro tema" };
function recuerda(clave, valor) {
  try { if (valor === undefined) return localStorage.getItem("fc-" + clave) || ""; localStorage.setItem("fc-" + clave, valor); } catch (e) { return ""; }
  return "";
}
function tarjetaContacto(c) {
  const k = (DATOS.contacto || {})[c.id] || {};
  return `<div class="contacto">
    <div><b class="rc-nom">${esc(c.corto)}</b><div class="sub">${esc(c.partido)} · ${c.camara === "S" ? "Senado" : "Diputados"}</div></div>
    ${k.correo ? `<a class="acta" href="mailto:${esc(k.correo)}">${esc(k.correo)}</a>` : `<span class="muted small">Correo no publicado</span>`}
    <div class="small muted">${k.votos_obtenidos ? `${k.votos_obtenidos.toLocaleString("es-PE")} votos en la elección de 2026` : ""}${k.ficha ? ` · <a href="${esc(k.ficha)}" target="_blank" rel="noopener">ficha oficial</a>` : ""}</div>
    <button type="button" class="redactar" data-para="${c.id}">Escribirle</button>
  </div>`;
}
function opcionesSobre(id, motivo) {
  const c = DATOS.congresistas.find(x => x.id === id); if (!c) return "";
  if (motivo === "proyecto") {
    const ps = DATOS.proyectos.filter(p => p.cusco[id] === "Autor principal");
    return ps.length ? ps.map(p => `<option value="${esc(p.numero)}">${numCorto(p.numero)} · ${esc(p.resumen ? p.resumen.tema : tituloCorto(p.titulo).slice(0, 80))}</option>`).join("") : `<option value="">No es autor principal de ningún proyecto</option>`;
  }
  if (motivo === "voto") {
    return DATOS.eventos.filter(e => e.camara === c.camara && e.tipo === "VOTACIÓN" && ["SI", "NO", "ABST"].includes(e.votos[id] || "")).slice(-15).reverse()
      .map((e, k) => `<option value="${esc(e.fecha + "|" + e.hora + "|" + k)}">${fecha(e.fecha)} · ${esc(LARGO[e.votos[id]])} · ${esc(capital(e.asunto).slice(0, 70))}</option>`).join("") || `<option value="">Sin votaciones registradas</option>`;
  }
  return "";
}
function textoMensaje() {
  const g = id => document.getElementById(id);
  const c = DATOS.congresistas.find(x => x.id === g("m-para").value); if (!c) return { asunto: "", cuerpo: "" };
  const motivo = g("m-motivo").value, sobre = g("m-sobre") ? g("m-sobre").value : "", nombre = g("m-nombre").value.trim(), prov = g("m-prov").value;
  const quien = nombre ? `Mi nombre es ${nombre}${prov ? ` y vivo en la provincia de ${prov}` : ""}.` : prov ? `Vivo en la provincia de ${prov}.` : "";
  let asunto = "Mensaje de un ciudadano del Cusco", centro = "";
  if (motivo === "proyecto" && sobre) {
    const p = DATOS.proyectos.find(x => x.numero === sobre);
    asunto = `Consulta sobre el proyecto de ley N.° ${numCorto(sobre)}`;
    const tit = tituloCorto(p.titulo);
    centro = `Le escribo sobre el proyecto de ley N.° ${numCorto(sobre)}, que ${tit.charAt(0).toLowerCase() + tit.slice(1)}, del que usted es autor. Quisiera saber en qué situación se encuentra, qué falta para que avance y cómo beneficiaría a la población del Cusco.`;
  } else if (motivo === "voto" && sobre) {
    const [f, h, k] = sobre.split("|");
    const e = DATOS.eventos.filter(x => x.camara === c.camara && x.tipo === "VOTACIÓN" && ["SI", "NO", "ABST"].includes(x.votos[c.id] || "")).slice(-15).reverse()[+k];
    asunto = `Consulta sobre su voto del ${fecha(f)}`;
    centro = `Le escribo sobre la votación del Pleno del ${fecha(f)} (${h}): «${capital(e.asunto).slice(0, 300)}». Según el acta oficial, usted votó ${LARGO[e.votos[c.id]].toLowerCase()}. Quisiera conocer las razones de su voto.`;
  } else if (motivo === "pedido") {
    asunto = `Pedido ciudadano${prov ? ` desde ${prov}` : " desde el Cusco"}`;
    centro = `Le escribo para pedirle que atienda el siguiente problema${prov ? ` de la provincia de ${prov}` : ""}: [describa aquí el problema y qué espera que haga]. Le agradeceré que me informe qué acciones tomará.`;
  } else {
    centro = "[Escriba aquí su mensaje.]";
  }
  const cuerpo = `Congresista ${c.corto}:\n\n${quien ? quien + " " : ""}${centro}\n\nQuedo atento/a a su respuesta.\n\nAtentamente,\n${nombre || "[Su nombre]"}${prov ? "\n" + prov : ""}`;
  return { asunto, cuerpo };
}
function actualizarMensaje(regenerar) {
  const g = id => document.getElementById(id); if (!g("m-para")) return;
  const c = DATOS.congresistas.find(x => x.id === g("m-para").value);
  if (regenerar) { const m = textoMensaje(); g("m-asunto").value = m.asunto; g("m-cuerpo").value = m.cuerpo; }
  const correo = ((DATOS.contacto || {})[c && c.id] || {}).correo || "";
  const enlace = g("m-abrir");
  enlace.href = `mailto:${correo}?subject=${encodeURIComponent(g("m-asunto").value)}&body=${encodeURIComponent(g("m-cuerpo").value.replace(/\n/g, "\r\n"))}`;
  enlace.toggleAttribute("aria-disabled", !correo);
  const k = ((DATOS.contacto || {})[c && c.id]) || {}, info = g("m-info");
  if (info) info.innerHTML = c ? [correo ? `<a class="acta" href="mailto:${esc(correo)}">${esc(correo)}</a>` : "Correo no publicado",
    k.votos_obtenidos ? `${k.votos_obtenidos.toLocaleString("es-PE")} votos en la elección de 2026` : "", k.ficha ? `<a href="${esc(k.ficha)}" target="_blank" rel="noopener">ficha oficial</a>` : ""].filter(Boolean).join("<br>") : "";
  g("m-dest").textContent = correo ? `Se abrirá tu propio correo, dirigido a ${correo}.` : "Este congresista no tiene un correo publicado.";
}
function seccionEscribele(soloId) {
  const lista = DATOS.congresistas.filter(c => !soloId || c.id === soloId);
  const inicial = soloId || DATOS.congresistas[0].id;
  return `<section class="sec" aria-labelledby="t-escribe${soloId ? "-f" : ""}" id="escribele">
    ${encabezado("Participa", soloId ? "Escríbele" : "Escríbele a tu congresista", "Su correo institucional es público. Arma tu mensaje aquí: se abre en tu propio correo para que lo revises y lo envíes tú. Esta página no guarda ni envía nada.", "t-escribe" + (soloId ? "-f" : ""))}
    ${soloId ? "" : `<div class="contactos solo-ancho">${lista.map(tarjetaContacto).join("")}</div>`}
    <form class="redactor" id="redactor" onsubmit="return false">
      <div class="r-campos">
        <label>Para<select id="m-para">${DATOS.congresistas.map(c => `<option value="${c.id}"${c.id === inicial ? " selected" : ""}>${esc(c.corto)}</option>`).join("")}</select></label>
        <label>Motivo<select id="m-motivo">${Object.entries(MOTIVOS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></label>
        <label class="r-ancho" id="m-sobre-l">Sobre<select id="m-sobre">${opcionesSobre(inicial, "proyecto")}</select></label>
        <label>Tu nombre <span class="muted">(opcional)</span><input id="m-nombre" type="text" autocomplete="name" value="${esc(recuerda("nombre"))}"></label>
        <label>Tu provincia <span class="muted">(opcional)</span><select id="m-prov"><option value="">—</option>${PROVINCIAS_CUSCO.map(p => `<option${recuerda("prov") === p ? " selected" : ""}>${p}</option>`).join("")}</select></label>
      </div>
      <p class="small solo-movil" id="m-info"></p>
      <label class="r-ancho">Asunto<input id="m-asunto" type="text"></label>
      <label class="r-ancho">Mensaje<textarea id="m-cuerpo" rows="11"></textarea></label>
      <div class="r-acciones"><a class="boton" id="m-abrir" href="#">Abrir en mi correo</a><button type="button" id="m-copiar">Copiar el mensaje</button><span class="small muted" id="m-dest" aria-live="polite"></span></div>
      <p class="small muted">Consejos: sé breve y concreto, di de qué provincia eres y pide una respuesta. Si no tienes un programa de correo, usa «Copiar el mensaje» y pégalo en tu correo web. También puedes presentar un pedido formal por la mesa de partes virtual del Congreso.</p>
    </form>
  </section>`;
}
document.addEventListener("change", ev => {
  const id = ev.target.id;
  if (id === "m-para" || id === "m-motivo") {
    const motivo = document.getElementById("m-motivo").value, sobre = document.getElementById("m-sobre");
    sobre.innerHTML = opcionesSobre(document.getElementById("m-para").value, motivo);
    document.getElementById("m-sobre-l").hidden = !["proyecto", "voto"].includes(motivo);
  }
  if (id === "m-prov") recuerda("prov", ev.target.value);
  if (["m-para", "m-motivo", "m-sobre", "m-prov"].includes(id)) actualizarMensaje(true);
});
document.addEventListener("input", ev => {
  if (ev.target.id === "m-nombre") { recuerda("nombre", ev.target.value); actualizarMensaje(true); }
  if (ev.target.id === "m-asunto" || ev.target.id === "m-cuerpo") actualizarMensaje(false);
});
document.addEventListener("click", ev => {
  const b = ev.target.closest(".redactar");
  if (b) { const s = document.getElementById("m-para"); s.value = b.dataset.para; s.dispatchEvent(new Event("change", { bubbles: true }));
    document.getElementById("redactor").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (ev.target.id === "m-copiar") {
    const t = `Para: ${(((DATOS.contacto || {})[document.getElementById("m-para").value]) || {}).correo || ""}\nAsunto: ${document.getElementById("m-asunto").value}\n\n${document.getElementById("m-cuerpo").value}`;
    const listo = () => { ev.target.textContent = "Copiado"; setTimeout(() => ev.target.textContent = "Copiar el mensaje", 1800); };
    try { navigator.clipboard.writeText(t).then(listo, () => { document.getElementById("m-cuerpo").select(); document.execCommand("copy"); listo(); }); }
    catch (e) { document.getElementById("m-cuerpo").select(); document.execCommand("copy"); listo(); }
  }
  if (ev.target.id === "m-abrir" && ev.target.hasAttribute("aria-disabled")) ev.preventDefault();
});

function pie() {
  return `<footer><div class="pie-marca">${siluetaCusco()}<p class="que-es"><b>Fiscaliza Cusco</b> es un observatorio ciudadano e independiente del Congreso de la República, hecho por Ciudad Sur con datos públicos oficiales.<br><span class="muted">Hecho en el Qosqo, para sus 13 provincias.</span></p></div>
    <h2>De dónde salen los datos</h2>
    <p>Todo sale de documentos oficiales del Congreso: el sistema de proyectos de ley, las actas de asistencia y votación del Pleno y el Diario de Debates. Cada cifra enlaza a su fuente. <a href="#como-se-hizo">Cómo se hizo, paso a paso</a>.</p>
    <p class="firma">${iconoMarca()}<span>Un proyecto de <a href="https://ciudadsur.pe" target="_blank" rel="noopener">Ciudad Sur</a> y <a href="https://www.instagram.com/sieteborreguitos" target="_blank" rel="noopener">@sieteborreguitos</a></span></p></footer>`;
}
function siluetaCusco(clase = "silueta") {

  return `<svg class="${clase}" viewBox="0 0 ${M.ancho} ${M.alto}" role="img" aria-label="Silueta del departamento de Cusco y sus 13 provincias">${Object.values(M.provincias).map(g => `<path d="${g.d}"/>`).join("")}</svg>`;
}
function metodologia() {
  return `<a class="volver" href="#inicio">← Volver a la portada</a>
  <header class="ficha-head"><span class="etq">Metodología</span><h1>Cómo se hizo</h1></header>
  ${tocapu()}
  <footer class="metodo"><ol>
    <li>Proyectos de ley: sistema de proposiciones legislativas del Congreso. Autor principal es el primer firmante, que es quien firma el texto; el sistema a veces marca a todos los firmantes como autores.</li>
    <li>Asistencia y votaciones: actas de asistencia y votación del Pleno que publica cada cámara. Muchas son escaneos; las lecturas dudosas se verificaron a mano contra la imagen del acta.</li>
    <li>Intervenciones: Diario de Debates, la transcripción oficial de cada sesión del Pleno. Se cuenta cada vez que el congresista toma la palabra como orador; los turnos presidiendo la sesión se cuentan aparte. Los resúmenes salen de leer la transcripción completa.</li>
    <li>Comparaciones: los promedios salen de la tabla de totales por bancada que trae cada acta. Solo se usan las actas cuya tabla cuadra al sumarla (la suma de las bancadas debe dar el total de la cámara); las demás se descartan. "Votó igual que su bancada" compara su voto con la posición de la mayoría de su bancada; no se cuentan las votaciones en que la bancada empató.</li>
    <li>Temas y provincias: se asignan con listas de palabras clave sobre el texto oficial (título, resumen y texto completo de cada proyecto; transcripción de cada intervención). Pueden tener errores puntuales; las reglas están publicadas en el código del proyecto.</li>
    <li>Redes: la red de coautoría incluye a todos los congresistas de cada cámara y une a quienes firmaron un mismo proyecto (como autores o coautores). Los grupos se detectan con el algoritmo de Louvain. La intermediación mide en cuántos de los caminos más cortos entre dos colegas está el congresista. La bancada de cada congresista sale de las actas de asistencia.</li>
    <li>Votación nominal: se lee el voto de todos los congresistas en cada acta. Una votación solo entra al análisis si los votos leídos de cada bancada suman exactamente lo que dice la tabla oficial de totales del acta; si en una bancada faltan votos de un solo tipo y hay exactamente esa cantidad de miembros sin leer, se deducen de la tabla. "¿De qué lado votan?" usa las votaciones en que la mayoría de Fuerza Popular y la de Juntos por el Perú votaron distinto. La afinidad entre cusqueños los ubica en el plano según cuánto coinciden (escalamiento multidimensional).</li>
    <li>Recorrido de los proyectos: el estado actual de cada proyecto en el sistema del Congreso, agrupado en etapas (presentado, en comisión, con dictamen, aprobado, ley, archivado). Las medianas de proyectos propios y de coautorías salen de todos los firmantes de cada cámara.</li>
    <li>Contacto: el correo institucional y los votos obtenidos salen de la ficha oficial de cada congresista en el portal de su cámara.</li>
    <li>Cada pase de lista y cada votación cuenta por separado. Solo incluye el Pleno, no las comisiones.</li>
    <li>Las cifras empiezan en julio de 2026. Con pocas sesiones, una sola ausencia mueve bastante los porcentajes.</li>
    <li>Si un dato está mal, el enlace "acta" o el número de proyecto lleva al documento original para comprobarlo.</li></ol></footer>
  ${tocapu()}
  ${pie()}`;
}

function filtrar(grupo, selector, prueba) {
  document.querySelectorAll(grupo + " button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(grupo + " button").forEach(x => x.setAttribute("aria-pressed", x === b));
    document.querySelectorAll(selector + " tr").forEach(tr => { tr.hidden = !prueba(b.dataset, tr); });
  }));
}

function mostrar(id = location.hash.slice(1)) {
  const c = DATOS.congresistas.find(x => x.slug === id);
  N_PLEGADO = 0;
  document.getElementById("app").innerHTML = c ? ficha(c) : id === "como-se-hizo" ? metodologia() : inicio();
  if (c) filtrar(".filtros", "#votos", (d, tr) => {
    const v = tr.querySelector(".voto").dataset.v;
    return d.v === "todas" || (d.v === "NO" && v === "NO") || (d.v === "ABST" && v === "ABST") || (d.v === "sin" && !["SI", "NO", "ABST", "***"].includes(v));
  });
  else filtrar(".filtros", "#acta", (d, tr) => d.f === "todas" || tr.classList.contains("split"));
  actualizarMensaje(true);
  window.scrollTo(0, 0);
}

// Interacción de temas, mapa, agenda y buscador (delegada: sobrevive al redibujado de la página)
let temporizador = null, tipoBusqueda = "";
document.addEventListener("submit", ev => {
  if (ev.target.id !== "form-q") return;
  ev.preventDefault(); clearTimeout(temporizador);
  buscar(document.getElementById("q").value, tipoBusqueda);
});
document.addEventListener("input", ev => {
  if (ev.target.id !== "q") return;
  clearTimeout(temporizador); tipoBusqueda = "";
  temporizador = setTimeout(() => buscar(ev.target.value, tipoBusqueda), 250);
});
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  const fichaId = (DATOS.congresistas.find(x => x.slug === location.hash.slice(1)) || {}).id;
  if (b.dataset.temaSel) {
    document.querySelectorAll("[data-tema-sel]").forEach(x => x.setAttribute("aria-pressed", x === b));
    document.getElementById("tema-detalle").innerHTML = detalleTema(b.dataset.temaSel);
  } else if (b.dataset.temaFicha) {
    document.getElementById("tema-ficha").innerHTML = `<h3 class="subtit">${esc(nomTema(b.dataset.temaFicha))}</h3>` + detalleTema(b.dataset.temaFicha, fichaId);
  } else if (b.dataset.tema && document.querySelector(`[data-tema-sel="${b.dataset.tema}"]`)) {
    const sel = document.querySelector(`[data-tema-sel="${b.dataset.tema}"]`); sel.click(); document.getElementById("temas").scrollIntoView({ behavior: "smooth" });
  } else if (b.dataset.mapaC !== undefined) {
    mapaFiltro = b.dataset.mapaC; redibujarMapa();
  } else if (b.dataset.ag) {
    document.querySelectorAll("[data-ag]").forEach(x => x.setAttribute("aria-pressed", x === b));
    document.querySelectorAll(".ag-item").forEach(x => x.hidden = b.dataset.ag === "cusco" && x.dataset.cus !== "1");
  } else if (b.dataset.mas) {
    buscar(document.getElementById("q").value, tipoBusqueda, true);
  } else if (b.dataset.qt !== undefined) {
    tipoBusqueda = b.dataset.qt; buscar(document.getElementById("q").value, tipoBusqueda);
  } else if (b.dataset.prov) {
    mapaSel = mapaSel === b.dataset.prov ? null : b.dataset.prov; redibujarMapa();
  }
});
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-desplegar], [data-filas-extra]"); if (!b) return;
  if (b.dataset.desplegar) {
    const d = document.getElementById(b.dataset.desplegar); d.hidden = !d.hidden;
    b.textContent = d.hidden ? `Ver ${b.dataset.n} más` : "Ver menos";
  } else {
    const filas = b.previousElementSibling.querySelectorAll(".fila-extra"), ocultas = filas[0] && filas[0].hidden;
    filas.forEach(f => f.hidden = !ocultas);
    b.textContent = ocultas ? "Ver menos" : `Ver ${filas.length} más`;
  }
});
// Al enfocar a un cusqueño, sus vínculos también como lista (en el celular la red se ve pequeña)
function listaVinculos(red, id) {
  const caja = document.getElementById("lista-" + red.id); if (!caja) return;
  const R = DATOS.redes.coautoria[red.id.slice(-1)], c = DATOS.congresistas.find(x => x.id === id);
  if (!id || !R || !c) { caja.innerHTML = ""; return; }
  const nodo = Object.fromEntries(R.nodos.map(n => [n.id, n]));
  const socios = R.aristas.filter(a => a.a === id || a.b === id).map(a => ({ n: nodo[a.a === id ? a.b : a.a], peso: a.peso })).sort((x, y) => y.peso - x.peso);
  caja.innerHTML = `<p class="red-lista-cab">${esc(c.corto)} firmó con ${socios.length} ${socios.length === 1 ? "colega" : "colegas"}:</p>` +
    plegar(socios.map(s => `<div><b>${esc(String(s.n.nombre).toLowerCase().replace(/(^|[\s-])\S/g, x => x.toUpperCase()))}</b> <span class="muted small">${esc(BANCADAS[s.n.bancada] || "")}, ${s.peso} ${s.peso === 1 ? "proyecto" : "proyectos"}</span></div>`), 8, "red-lista");
}
function enfocarRed(red, id) {
  red.querySelectorAll(".on").forEach(x => x.classList.remove("on"));
  const grupo = document.querySelector(`[data-red="${red.id}"]`);
  if (grupo) grupo.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.foco === (id || "")));
  if (!id || red.dataset.foco === id) { red.classList.remove("foco"); red.dataset.foco = ""; listaVinculos(red, ""); if (grupo) grupo.querySelector('[data-foco=""]').setAttribute("aria-pressed", "true"); return; }
  red.dataset.foco = id; red.classList.add("foco");
  listaVinculos(red, id);
  const vec = new Set([id]);
  red.querySelectorAll(".arista").forEach(a => { if (a.dataset.a === id || a.dataset.b === id) { a.classList.add("on"); vec.add(a.dataset.a); vec.add(a.dataset.b); } });
  red.querySelectorAll(".nodo, text").forEach(x => { if (vec.has(x.dataset.n)) x.classList.add("on"); });
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-red] button");
  if (b) { const red = document.getElementById(b.closest("[data-red]").dataset.red); if (red) enfocarRed(red, red.dataset.foco === b.dataset.foco ? "" : b.dataset.foco); return; }
  const n = ev.target.closest(".red .nodo"), red = n && n.closest(".red[id]");
  if (red && n.classList.contains("cus")) enfocarRed(red, n.dataset.n);
});
document.addEventListener("click", ev => {
  const p = ev.target.closest("path.prov"); if (!p) return;
  mapaSel = mapaSel === p.dataset.prov ? null : p.dataset.prov; redibujarMapa();
});
function redibujarMapa() {
  const sec = document.getElementById("mapa"); if (!sec) return;
  const fichaId = (DATOS.congresistas.find(x => x.slug === location.hash.slice(1)) || {}).id;
  sec.outerHTML = seccionMapa(fichaId);
}

// Tooltip compartido para cuadros del tejido, barras y pases de lista.
const tip = document.getElementById("tip");
document.addEventListener("pointermove", ev => {
  if (ev.pointerType !== "mouse") return;
  const t = ev.target.closest && ev.target.closest("[data-tip]");
  if (!t) { tip.hidden = true; return; }
  tip.innerHTML = t.getAttribute("data-tip");
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(ev.clientX + 14, innerWidth - w - 8) + "px";
  tip.style.top = (ev.clientY + 16 + h > innerHeight ? ev.clientY - h - 12 : ev.clientY + 16) + "px";
});
let toque = false, tipFijo = null;
document.addEventListener("pointerdown", ev => { toque = ev.pointerType !== "mouse"; }, true);
document.addEventListener("click", ev => {
  if (!toque && !matchMedia("(hover: none)").matches) return;
  const t = ev.target.closest && ev.target.closest("[data-tip]");
  if (!t || t === tipFijo || t.closest("a[href]")) { tip.hidden = true; tipFijo = null; return; }
  tip.innerHTML = t.getAttribute("data-tip"); tip.hidden = false; tipFijo = t;
  const r = t.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8) + "px";
  tip.style.top = (r.top - h - 10 > 8 ? r.top - h - 10 : r.bottom + 10) + "px";
});
// Al desplazarse: se oculta el globo, aparece "volver arriba" y el menú marca la sección en pantalla
let pendiente = false;
addEventListener("scroll", () => {
  if (tipFijo) { tip.hidden = true; tipFijo = null; }
  if (pendiente) return; pendiente = true;
  requestAnimationFrame(() => {
    pendiente = false;
    document.getElementById("arriba").hidden = scrollY < 1200;
    const menu = document.querySelector(".menu-sec"); if (!menu) return;
    let actual = null;
    SECCIONES.forEach(([id]) => { const d = document.getElementById(id); if (d && d.getBoundingClientRect().top < 120) actual = id; });
    if (!actual && menu.querySelector('[aria-current="true"]')) menu.scrollTo({ left: 0, behavior: "smooth" });
    menu.querySelectorAll("a").forEach(a => {
      const si = a.dataset.ir === actual;
      if (si && a.getAttribute("aria-current") !== "true") menu.scrollTo({ left: a.offsetLeft - 16, behavior: "smooth" });
      si ? a.setAttribute("aria-current", "true") : a.removeAttribute("aria-current");
    });
  });
}, { passive: true });
document.getElementById("arriba").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
// Pestañas del padrón en el celular
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-pbm]"); if (!b) return;
  const caja = b.closest(".pbm");
  caja.querySelectorAll("[data-pbm]").forEach(x => x.setAttribute("aria-pressed", x === b));
  caja.querySelectorAll(".pbm-panel").forEach(p => p.hidden = p.dataset.panel !== b.dataset.pbm);
});
// Los enlaces internos (#holguin) se resuelven en la página; algunos visores no propagan el cambio de ancla.
document.addEventListener("click", ev => {
  const a = ev.target.closest('a[href^="#"]');
  if (!a) return;
  ev.preventDefault();
  if (a.dataset.ir) { const d = document.getElementById(a.dataset.ir); if (d) d.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const id = a.getAttribute("href").slice(1);
  try { history.pushState(null, "", "#" + id); } catch (e) { /* algunos visores no lo permiten */ }
  mostrar(id);
});
window.addEventListener("popstate", () => mostrar());
mostrar();
</script>
