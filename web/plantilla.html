// Afinidad entre los cusqueños: cada uno ubicado según cuánto coincide con los demás (más coincidencia, más cerca).
function afinidadCusquenos() {
  const A = DATOS.redes.pares_cusquenos, P = DATOS.redes.afinidad_xy, dip = DATOS.congresistas.filter(c => c.camara === "D");
  if (!P) return "";
  const W = 640, H = 500, cx = W / 2, cy = H / 2;
  const p = dip.map(c => ({ c, x: cx + P[c.id][0] * 1.3, y: cy + P[c.id][1] * 1.15 }));
  const par = (a, b) => A[`${a}-${b}`] || A[`${b}-${a}`];
  const lazos = [];
  for (let i = 0; i < p.length; i++) for (let j = i + 1; j < p.length; j++) { const d = par(p[i].c.id, p[j].c.id); if (d && d.pct != null) lazos.push({ a: p[i], b: p[j], d }); }
  lazos.sort((u, v) => u.d.pct - v.d.pct);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diputados cusqueños ubicados según cuánto coinciden sus votos: más cerca, más coincidencia">`;
  lazos.forEach(({ a, b, d }) => {
    const fuerte = d.pct >= 90, medio = d.pct >= 80;
    s += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="lazo ${fuerte ? "fuerte" : medio ? "medio" : "debil"}"
      data-tip="<b>${esc(a.c.corto)} y ${esc(b.c.corto)}</b><br>Votaron igual en ${d.igual} de ${d.total} votaciones (${pct1(d.pct)})"/>`;
  });
  // Cifras: en el medio de cada línea; si la línea es corta, desplazadas hacia un costado
  const ocupados = p.map(q => ({ x: q.x, y: q.y }));
  lazos.forEach(({ a, b, d }) => {
    const fuerte = d.pct >= 90, largo = Math.hypot(b.x - a.x, b.y - a.y);
    let mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (largo < 110) { const nx = -(b.y - a.y) / largo, ny = (b.x - a.x) / largo; const sgn = (mx - cx) * nx + (my - cy) * ny >= 0 ? 1 : -1; mx += nx * 24 * sgn; my += ny * 24 * sgn; }
    // Si la cifra cae sobre otro diputado o sobre otra cifra, se corre a lo largo de su línea
    for (const t of [0.35, 0.65, 0.25, 0.75]) {
      if (!ocupados.some(o => Math.hypot(o.x - mx, o.y - my) < 30)) break;
      mx = a.x + (b.x - a.x) * t; my = a.y + (b.y - a.y) * t;
    }
    ocupados.push({ x: mx, y: my });
    s += `<text class="pct ${fuerte ? "fuerte" : ""}" x="${mx}" y="${my}" dy="5" text-anchor="middle">${Math.round(d.pct)}%</text>`;
  });
  p.forEach(q => { const b = CODIGO_PARTIDO[q.c.partido];
    s += forma(b, q.x, q.y, 17, `class="nodo cus" style="stroke:var(--ink);stroke-width:3" data-tip="<b>${esc(q.c.corto)}</b> · ${esc(q.c.partido)}"`); });
  // Nombres: en la dirección con más espacio libre (lejos de otros nodos, cifras y nombres)
  p.forEach(q => {
    let mejor = null;
    for (let k = 0; k < 8; k++) {
      const ang = k * Math.PI / 4, lx = q.x + Math.cos(ang) * 44, ly = q.y + Math.sin(ang) * 34;
      const libre = Math.min(...ocupados.filter(o => o.x !== q.x || o.y !== q.y).map(o => Math.hypot(o.x - lx, o.y - ly)), lx - 40, W - 40 - lx, ly - 20, H - 10 - ly);
      if (!mejor || libre > mejor.libre) mejor = { libre, lx, ly, ang };
    }
    ocupados.push({ x: mejor.lx, y: mejor.ly });
    const c = Math.cos(mejor.ang);
    s += `<text class="nom" x="${mejor.lx}" y="${mejor.ly + 6}" text-anchor="${c > 0.3 ? "start" : c < -0.3 ? "end" : "middle"}">${esc(apellido(q.c))}</text>`;
  });
  return s + "</svg>";
}

function hallazgos() {
  const D = DATOS.redes.coautoria.D, V = DATOS.redes.votacion && DATOS.redes.votacion.D;
  const cus = DATOS.congresistas.filter(c => c.camara === "D");
  const nom = id => (cus.find(c => c.id === id) || {}).corto || id;
  const top = Object.entries(D.metricas).sort((a, b) => b[1].intermediacion - a[1].intermediacion)[0];
  const solos = Object.entries(D.metricas).filter(([, m]) => !m.fuera_de_bancada).map(([id]) => nom(id));
  const l = [];
  l.push(`En Diputados casi nadie firma con otras bancadas: la mediana es ${pct1(D.mediana_fuera_camara ?? Object.values(D.metricas)[0].mediana_fuera_camara)} de las firmas. Los ${D.comunidades.length} grupos que encuentra el algoritmo coinciden con las ${D.comunidades.length} bancadas.`);
  if (top) l.push(`${esc(nom(top[0]))} es el cusqueño que más conecta grupos: puesto ${top[1].puesto_intermediacion} de ${D.nodos.length} en ${glosa("intermediación", "Qué tanto un congresista une a colegas que no firman entre sí. Alto: hace de puente entre grupos.")}, con ${pct1(top[1].fuera_de_bancada)} de sus firmas fuera de su bancada.`);
  if (solos.length) l.push(`${solos.map(esc).join(", ").replace(/, ([^,]*)$/, " y $1")} ${solos.length === 1 ? "solo firmó" : "solo firmaron"} con su propia bancada.`);
  return `<ul class="hallazgos">${l.map(x => `<li>${x}</li>`).join("")}</ul>`;
}

/* ---------- Padrón: proyectos, coautorías e intervenciones ---------- */
function padronBarras() {
  const R = DATOS.recorrido, ctx = (DATOS.contexto || {}).congresistas || {}, camCtx = (DATOS.contexto || {}).camaras || {};
  const filas = DATOS.congresistas.map(c => {
    const k = cifras(c), cam = (R && R.camaras[c.camara]) || {}, x = ctx[c.id] || {};
    return { c, k, b: CODIGO_PARTIDO[c.partido], asis: k.pases ? Math.round(1000 * k.presente / k.pases) / 10 : 0, medA: (camCtx[c.camara] || {}).asistencia,
      propios: k.autor, coautor: k.coautor, habla: k.habla, palabras: x.palabras, puesto: x.puesto_palabras, miembros: x.miembros,
      medP: cam.mediana_propios, medC: cam.mediana_coautor };
  });
  const cols = [
    { clave: "asis", med: "medA", titulo: "Asistencia", nota: "pases de lista", max: 100, pct: true },
    { clave: "propios", med: "medP", titulo: "Proyectos propios", nota: "como autor principal" },
    { clave: "coautor", med: "medC", titulo: "Como coautor", nota: "proyectos de otros" },
    { clave: "habla", med: null, titulo: "Intervenciones", nota: "como orador" },
  ];
  cols.forEach(col => { col.max = col.max || Math.max(1, ...filas.map(f => Math.max(f[col.clave] || 0, col.med ? f[col.med] || 0 : 0))); });
  const barra = (f, col) => {
    const v = f[col.clave] || 0, pct = 100 * v / col.max, med = col.med ? f[col.med] : null;
    const tip = col.clave === "asis"
      ? `<b>${esc(f.c.corto)}</b>: presente en ${f.k.presente} de ${f.k.pases} pases de lista (${pct1(v)})${med != null ? `<br>Promedio de ${f.c.camara === "S" ? "los senadores" : "los diputados"}: ${pct1(med)}` : ""}<br>Votó en ${f.k.participo} de ${f.k.votables} votaciones`
      : col.clave === "habla"
      ? `<b>${esc(f.c.corto)}</b>: ${v} ${v === 1 ? "intervención" : "intervenciones"}${f.palabras ? `<br>${f.palabras.toLocaleString("es-PE")} palabras · puesto ${f.puesto} de ${f.miembros} en su cámara` : ""}`
      : `<b>${esc(f.c.corto)}</b>: ${v} ${col.clave === "propios" ? (v === 1 ? "proyecto como autor principal" : "proyectos como autor principal") : (v === 1 ? "proyecto como coautor" : "proyectos como coautor")}${med != null ? `<br>Mediana de ${f.c.camara === "S" ? "los senadores" : "los diputados"}: ${String(med).replace(".", ",")}` : ""}`;
    return `<div class="pb-celda" data-tip="${tip}">
      <div class="pb-pista">${v ? `<i style="width:${pct.toFixed(1)}%;background:var(--b-${f.b}, var(--ink))"></i>` : ""}${med != null ? `<b class="pb-med" style="left:${(100 * med / col.max).toFixed(1)}%"></b>` : ""}</div>
      <span class="pb-v${col.pct && v < (med || 0) ? " bajo" : ""}">${col.pct ? Math.round(v) + "<small>%</small>" : v}</span>
      ${col.clave === "asis" ? `<span class="pb-sub">${f.k.presente} de ${f.k.pases} · votó en ${f.k.participo} de ${f.k.votables} votaciones</span>` : ""}
      ${col.clave === "habla" && f.palabras ? `<span class="pb-sub">${f.palabras.toLocaleString("es-PE")} palabras · puesto ${f.puesto} de ${f.miembros}</span>` : ""}
    </div>`;
  };
  // En el celular: una pestaña por indicador, con los seis en un mismo gráfico
  const movil = `<div class="pbm"><div class="chips desliza" role="group" aria-label="Elegir indicador">${cols.map((col, k) =>
      `<button type="button" data-pbm="${k}" aria-pressed="${k === 0}">${col.titulo}</button>`).join("")}</div>
    ${cols.map((col, k) => `<div class="pbm-panel" data-panel="${k}"${k ? " hidden" : ""}><p class="pbm-nota">${col.titulo}: ${col.nota}${col.med ? ". La marca vertical es " + (col.clave === "asis" ? "el promedio" : "la mediana") + " de su cámara" : ""}.</p>
      ${filas.map(f => `<a class="pbm-fila" href="#${f.c.slug}"><span><span class="pbm-nom">${esc(apellido(f.c))}</span><span class="pb-sub"><svg class="pb-forma" viewBox="0 0 16 16" aria-hidden="true">${forma(f.b, 8, 8, 6.5)}</svg>${f.c.camara === "S" ? "Senado" : esc(f.b)}</span></span>${barra(f, col)}</a>`).join("")}</div>`).join("")}</div>`;
  return `${movil}<div class="pb" role="table" aria-label="Proyectos propios, coautorías e intervenciones de cada congresista">
    <div class="pb-fila pb-cab" role="row"><span role="columnheader"></span>${cols.map(col => `<span role="columnheader"><b>${col.titulo}</b><br><span class="muted">${col.nota}</span></span>`).join("")}</div>
    ${filas.map(f => `<a class="pb-fila" role="row" href="#${f.c.slug}">
      <span role="cell"><span class="pb-nom">${esc(f.c.corto)}</span><span class="pb-sub"><svg class="pb-forma" viewBox="0 0 16 16" aria-hidden="true">${forma(f.b, 8, 8, 6.5)}</svg>${esc(f.c.partido)} · ${f.c.camara === "S" ? "Senado" : "Diputados"}</span></span>
      ${cols.map(col => `<span role="cell">${barra(f, col)}</span>`).join("")}</a>`).join("")}
  </div>
  <p class="muted small">Cada barra lleva el color de la bancada del congresista. Marca vertical: en asistencia, el promedio de su cámara (${pct1(camCtx.D && camCtx.D.asistencia)} en Diputados, ${pct1(camCtx.S && camCtx.S.asistencia)} en el Senado); en proyectos, la mediana de su cámara (${R ? `${String(R.camaras.D.mediana_propios).replace(".", ",")} proyectos propios y ${String(R.camaras.D.mediana_coautor).replace(".", ",")} como coautor entre los diputados; ${String(R.camaras.S.mediana_propios).replace(".", ",")} y ${String(R.camaras.S.mediana_coautor).replace(".", ",")} entre los senadores, porque casi todos los proyectos entran por Diputados` : ""}). Las intervenciones no cuentan los turnos presidiendo la sesión.</p>`;
}

const COLOR_ETAPA = [0, 1, 2, 3, 4].map(k => `color-mix(in oklab, var(--ink) ${[22, 42, 64, 84, 100][k]}%, var(--paper))`);
function cuadroEtapa(p, c) {

}
function leyendaEtapas() {

}
function barraCamara(r) {

    data-tip="<b>${n}</b> de ${r.total} proyectos (${pct1(100 * n / r.total)}): ${esc(DATOS.recorrido.etapas[k])}"></i>` : "").join("")}</div>`;
}
function filaRecorrido(c) {
  const r = DATOS.recorrido.congresistas[c.id];
  const co = r.coautor;

function seccionRecorrido(soloId) {

  if (motivo === "voto") {
    return DATOS.eventos.filter(e => e.camara === c.camara && e.tipo === "VOTACIÓN" && ["SI", "NO", "ABST"].includes(e.votos[id] || "")).slice(-15).reverse()
      .map((e, k) => `<option value="${esc(e.fecha + "|" + e.hora + "|" + k)}">${fecha(e.fecha)} · ${esc(LARGO[e.votos[id]])} · ${esc(capital(e.asunto).slice(0, 70))}</option>`).join("") || `<option value="">Sin votaciones registradas</option>`;
  }
  return "";
}
function textoMensaje() {
  const g = id => document.getElementById(id);
  const c = DATOS.congresistas.find(x => x.id === g("m-para").value); if (!c) return { asunto: "", cuerpo: "" };
  const motivo = g("m-motivo").value, sobre = g("m-sobre") ? g("m-sobre").value : "", nombre = g("m-nombre").value.trim(), prov = g("m-prov").value;
  const quien = nombre ? `Mi nombre es ${nombre}${prov ? ` y vivo en la provincia de ${prov}` : ""}.` : prov ? `Vivo en la provincia de ${prov}.` : "";
  let asunto = "Mensaje de un ciudadano del Cusco", centro = "";
  if (motivo === "proyecto" && sobre) {
    const p = DATOS.proyectos.find(x => x.numero === sobre);
    asunto = `Consulta sobre el proyecto de ley N.° ${numCorto(sobre)}`;
    const tit = tituloCorto(p.titulo);
    centro = `Le escribo sobre el proyecto de ley N.° ${numCorto(sobre)}, que ${tit.charAt(0).toLowerCase() + tit.slice(1)}, del que usted es autor. Quisiera saber en qué situación se encuentra, qué falta para que avance y cómo beneficiaría a la población del Cusco.`;
  } else if (motivo === "voto" && sobre) {
    const [f, h, k] = sobre.split("|");
    const e = DATOS.eventos.filter(x => x.camara === c.camara && x.tipo === "VOTACIÓN" && ["SI", "NO", "ABST"].includes(x.votos[c.id] || "")).slice(-15).reverse()[+k];
    asunto = `Consulta sobre su voto del ${fecha(f)}`;
    centro = `Le escribo sobre la votación del Pleno del ${fecha(f)} (${h}): «${capital(e.asunto).slice(0, 300)}». Según el acta oficial, usted votó ${LARGO[e.votos[c.id]].toLowerCase()}. Quisiera conocer las razones de su voto.`;
  } else if (motivo === "pedido") {
    asunto = `Pedido ciudadano${prov ? ` desde ${prov}` : " desde el Cusco"}`;
    centro = `Le escribo para pedirle que atienda el siguiente problema${prov ? ` de la provincia de ${prov}` : ""}: [describa aquí el problema y qué espera que haga]. Le agradeceré que me informe qué acciones tomará.`;
  } else {
    centro = "[Escriba aquí su mensaje.]";
  }
  const cuerpo = `Congresista ${c.corto}:\n\n${quien ? quien + " " : ""}${centro}\n\nQuedo atento/a a su respuesta.\n\nAtentamente,\n${nombre || "[Su nombre]"}${prov ? "\n" + prov : ""}`;
  return { asunto, cuerpo };
}

function pie() {
  return `<footer><div class="pie-marca">${siluetaCusco()}<p class="que-es"><b>Fiscaliza Cusco</b> es un observatorio ciudadano e independiente del Congreso de la República, hecho por Ciudad Sur con datos públicos oficiales.<br><span class="muted">Hecho en el Qosqo, para sus 13 provincias.</span></p></div>
    <h2>De dónde salen los datos</h2>

    <p class="firma">${iconoMarca()}<span>Un proyecto de <a href="https://ciudadsur.pe" target="_blank" rel="noopener">Ciudad Sur</a> y <a href="https://www.instagram.com/sieteborreguitos" target="_blank" rel="noopener">@sieteborreguitos</a></span></p></footer>`;

function siluetaCusco(clase = "silueta") {

}
function metodologia() {
  return `<a class="volver" href="#inicio">← Volver a la portada</a>
  <header class="ficha-head"><span class="etq">Metodología</span><h1>Cómo se hizo</h1></header>
  ${tocapu()}
  <footer class="metodo"><ol>
    <li>Proyectos de ley: sistema de proposiciones legislativas del Congreso. Autor principal es el primer firmante, que es quien firma el texto; el sistema a veces marca a todos los firmantes como autores.</li>
    <li>Asistencia y votaciones: actas de asistencia y votación del Pleno que publica cada cámara. Muchas son escaneos; las lecturas dudosas se verificaron a mano contra la imagen del acta.</li>
    <li>Intervenciones: Diario de Debates, la transcripción oficial de cada sesión del Pleno. Se cuenta cada vez que el congresista toma la palabra como orador; los turnos presidiendo la sesión se cuentan aparte. Los resúmenes salen de leer la transcripción completa.</li>
    <li>Comparaciones: los promedios salen de la tabla de totales por bancada que trae cada acta. Solo se usan las actas cuya tabla cuadra al sumarla (la suma de las bancadas debe dar el total de la cámara); las demás se descartan. "Votó igual que su bancada" compara su voto con la posición de la mayoría de su bancada; no se cuentan las votaciones en que la bancada empató.</li>
    <li>Temas y provincias: se asignan con listas de palabras clave sobre el texto oficial (título, resumen y texto completo de cada proyecto; transcripción de cada intervención). Pueden tener errores puntuales; las reglas están publicadas en el código del proyecto.</li>
    <li>Redes: la red de coautoría incluye a todos los congresistas de cada cámara y une a quienes firmaron un mismo proyecto (como autores o coautores). Los grupos se detectan con el algoritmo de Louvain. La intermediación mide en cuántos de los caminos más cortos entre dos colegas está el congresista. La bancada de cada congresista sale de las actas de asistencia.</li>
    <li>Votación nominal: se lee el voto de todos los congresistas en cada acta. Una votación solo entra al análisis si los votos leídos de cada bancada suman exactamente lo que dice la tabla oficial de totales del acta; si en una bancada faltan votos de un solo tipo y hay exactamente esa cantidad de miembros sin leer, se deducen de la tabla. "¿De qué lado votan?" usa las votaciones en que la mayoría de Fuerza Popular y la de Juntos por el Perú votaron distinto. La afinidad entre cusqueños los ubica en el plano según cuánto coinciden (escalamiento multidimensional).</li>
    <li>Recorrido de los proyectos: el estado actual de cada proyecto en el sistema del Congreso, agrupado en etapas (presentado, en comisión, con dictamen, aprobado, ley, archivado). Las medianas de proyectos propios y de coautorías salen de todos los firmantes de cada cámara.</li>
    <li>Contacto: el correo institucional y los votos obtenidos salen de la ficha oficial de cada congresista en el portal de su cámara.</li>
    <li>Cada pase de lista y cada votación cuenta por separado. Solo incluye el Pleno, no las comisiones.</li>
    <li>Las cifras empiezan en julio de 2026. Con pocas sesiones, una sola ausencia mueve bastante los porcentajes.</li>
    <li>Si un dato está mal, el enlace "acta" o el número de proyecto lleva al documento original para comprobarlo.</li></ol></footer>
  ${tocapu()}
  ${pie()}`;
}

function filtrar(grupo, selector, prueba) {

  }));
}

function enfocarRed(red, id) {

  if (grupo) grupo.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.foco === (id || "")));
  if (!id || red.dataset.foco === id) { red.classList.remove("foco"); red.dataset.foco = ""; listaVinculos(red, ""); if (grupo) grupo.querySelector('[data-foco=""]').setAttribute("aria-pressed", "true"); return; }
  red.dataset.foco = id; red.classList.add("foco");
  listaVinculos(red, id);
  const vec = new Set([id]);
  red.querySelectorAll(".arista").forEach(a => { if (a.dataset.a === id || a.dataset.b === id) { a.classList.add("on"); vec.add(a.dataset.a); vec.add(a.dataset.b); } });

// Tooltip compartido para cuadros del tejido, barras y pases de lista.
const tip = document.getElementById("tip");
document.addEventListener("pointermove", ev => {
  if (ev.pointerType !== "mouse") return;
  const t = ev.target.closest && ev.target.closest("[data-tip]");
  if (!t) { tip.hidden = true; return; }
  tip.innerHTML = t.getAttribute("data-tip");
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(ev.clientX + 14, innerWidth - w - 8) + "px";
  tip.style.top = (ev.clientY + 16 + h > innerHeight ? ev.clientY - h - 12 : ev.clientY + 16) + "px";
});
let toque = false, tipFijo = null;
document.addEventListener("pointerdown", ev => { toque = ev.pointerType !== "mouse"; }, true);
document.addEventListener("click", ev => {
  if (!toque && !matchMedia("(hover: none)").matches) return;
  const t = ev.target.closest && ev.target.closest("[data-tip]");
  if (!t || t === tipFijo || t.closest("a[href]")) { tip.hidden = true; tipFijo = null; return; }
  tip.innerHTML = t.getAttribute("data-tip"); tip.hidden = false; tipFijo = t;
  const r = t.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8) + "px";
  tip.style.top = (r.top - h - 10 > 8 ? r.top - h - 10 : r.bottom + 10) + "px";
});
// Al desplazarse: se oculta el globo, aparece "volver arriba" y el menú marca la sección en pantalla

addEventListener("scroll", () => {

document.getElementById("arriba").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
// Pestañas del padrón en el celular
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-pbm]"); if (!b) return;
  const caja = b.closest(".pbm");
  caja.querySelectorAll("[data-pbm]").forEach(x => x.setAttribute("aria-pressed", x === b));
  caja.querySelectorAll(".pbm-panel").forEach(p => p.hidden = p.dataset.panel !== b.dataset.pbm);
});
// Los enlaces internos (#holguin) se resuelven en la página; algunos visores no propagan el cambio de ancla.
document.addEventListener("click", ev => {
  const a = ev.target.closest('a[href^="#"]');
  if (!a) return;
  ev.preventDefault();
  if (a.dataset.ir) { const d = document.getElementById(a.dataset.ir); if (d) d.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const id = a.getAttribute("href").slice(1);
  try { history.pushState(null, "", "#" + id); } catch (e) { /* algunos visores no lo permiten */ }
  mostrar(id);
});
window.addEventListener("popstate", () => mostrar());
mostrar();
</script>
